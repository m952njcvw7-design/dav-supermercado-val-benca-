<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Caixa Livre - Supermercado Val Bença</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:#f5f5f5;
    color:#222;
    height:100vh;
    overflow:hidden;
}

/* TOPO */
.topo{
    height:75px;
    background:#171717;
    color:white;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 25px;
}

.titulo{
    display:flex;
    align-items:center;
    gap:15px;
}

.titulo h1{
    font-size:28px;
    letter-spacing:1px;
}

.titulo span{
    color:#aaa;
    font-size:14px;
}

/* GT DELIVERY */
.gt{
    display:flex;
    align-items:center;
    gap:6px;
    color:#ff7900;
    font-size:11px;
    font-weight:bold;
}

.gt-logo{
    width:28px;
    height:28px;
    border-radius:7px;
    background:#ff7900;
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:11px;
}

/* ÁREA PRINCIPAL */
.principal{
    height:calc(100vh - 75px);
    display:flex;
    flex-direction:column;
    padding:20px 25px;
}

/* BUSCA */
.busca{
    display:flex;
    gap:10px;
    margin-bottom:15px;
}

.busca input{
    flex:1;
    height:55px;
    border:2px solid #ddd;
    border-radius:8px;
    padding:0 18px;
    font-size:19px;
    outline:none;
    background:white;
}

.busca input:focus{
    border-color:#ff7900;
}

.btn-adicionar{
    height:55px;
    padding:0 25px;
    border:0;
    border-radius:8px;
    background:#ff7900;
    color:white;
    font-weight:bold;
    font-size:16px;
    cursor:pointer;
}

/* TABELA */
.tabela-area{
    flex:1;
    background:white;
    border-radius:10px;
    border:1px solid #ddd;
    overflow:auto;
}

table{
    width:100%;
    border-collapse:collapse;
}

thead{
    position:sticky;
    top:0;
    background:#222;
    color:white;
}

th,td{
    padding:15px;
    text-align:left;
    border-bottom:1px solid #eee;
}

th{
    font-size:13px;
}

td{
    font-size:16px;
}

.vazio{
    text-align:center;
    color:#999;
    padding:70px 20px;
    font-size:18px;
}

/* RODAPÉ DO CAIXA */
.rodape{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:15px;
    gap:20px;
}

.info{
    color:#777;
    font-size:14px;
}

.total-area{
    text-align:right;
}

.total-label{
    font-size:14px;
    color:#777;
}

.total{
    font-size:38px;
    font-weight:bold;
    color:#111;
}

.botoes{
    display:flex;
    gap:10px;
}

.btn{
    border:0;
    border-radius:8px;
    padding:15px 24px;
    font-weight:bold;
    cursor:pointer;
    font-size:15px;
}

.cancelar{
    background:#ddd;
    color:#333;
}

.finalizar{
    background:#ff7900;
    color:white;
    min-width:190px;
}

/* MENU ESCONDIDO */
.menu-btn{
    position:fixed;
    bottom:18px;
    left:20px;
    width:45px;
    height:45px;
    border:0;
    border-radius:50%;
    background:#222;
    color:white;
    font-size:21px;
    cursor:pointer;
}

.menu{
    position:fixed;
    left:20px;
    bottom:72px;
    width:240px;
    background:white;
    border-radius:10px;
    box-shadow:0 5px 25px #0003;
    padding:10px;
    display:none;
    z-index:10;
}

.menu.aberto{
    display:block;
}

.menu h3{
    padding:12px;
    border-bottom:1px solid #eee;
}

.menu button{
    width:100%;
    border:0;
    background:white;
    text-align:left;
    padding:14px;
    border-radius:7px;
    cursor:pointer;
    font-size:15px;
}

.menu button:hover{
    background:#f1f1f1;
}

/* PAGAMENTO */
.modal{
    position:fixed;
    inset:0;
    background:#0008;
    display:none;
    align-items:center;
    justify-content:center;
    z-index:20;
}

.modal.aberto{
    display:flex;
}

.caixa-pagamento{
    background:white;
    width:420px;
    max-width:90%;
    border-radius:14px;
    padding:25px;
}

.caixa-pagamento h2{
    margin-bottom:20px;
}

.valor-final{
    font-size:34px;
    font-weight:bold;
    margin-bottom:20px;
}

.forma{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

.forma button{
    padding:18px;
    border:1px solid #ddd;
    border-radius:8px;
    background:#fafafa;
    cursor:pointer;
    font-weight:bold;
}

.forma button:hover{
    background:#ff7900;
    color:white;
}

.fechar{
    margin-top:15px;
    width:100%;
}

/* CELULAR */
@media(max-width:700px){

    body{
        overflow:auto;
    }

    .topo{
        height:65px;
        padding:0 12px;
    }

    .titulo h1{
        font-size:21px;
    }

    .titulo span{
        display:none;
    }

    .principal{
        height:auto;
        min-height:calc(100vh - 65px);
        padding:12px;
    }

    .busca{
        flex-direction:column;
    }

    .btn-adicionar{
        width:100%;
    }

    th,td{
        padding:10px 7px;
        font-size:12px;
    }

    .rodape{
        flex-direction:column;
        align-items:stretch;
    }

    .total-area{
        text-align:center;
    }

    .botoes{
        display:grid;
        grid-template-columns:1fr 1fr;
    }

    .finalizar{
        min-width:0;
    }
}
</style>
</head>

<body>

<!-- TOPO -->
<header class="topo">

    <div class="titulo">
        <h1>CAIXA LIVRE</h1>
        <span>Supermercado Val Bença</span>
    </div>

    <div class="gt">
        <div class="gt-logo">GT</div>
        GT DELIVERY
    </div>

</header>


<!-- CAIXA -->
<main class="principal">

    <div class="busca">

        <input
            id="codigo"
            type="text"
            inputmode="numeric"
            autofocus
            placeholder="Passe o código de barras no leitor..."
            onkeydown="lerCodigo(event)"
        >

        <button
            class="btn-adicionar"
            onclick="adicionarProduto()">
            ADICIONAR
        </button>

    </div>


    <div class="tabela-area">

        <table>

            <thead>
                <tr>
                    <th>CÓDIGO</th>
                    <th>PRODUTO</th>
                    <th>QTD.</th>
                    <th>PREÇO</th>
                    <th>TOTAL</th>
                </tr>
            </thead>

            <tbody id="lista">

                <tr id="mensagem">
                    <td colspan="5" class="vazio">
                        Passe o primeiro produto no leitor de código de barras
                    </td>
                </tr>

            </tbody>

        </table>

    </div>


    <div class="rodape">

        <div class="info">
            Itens: <strong id="quantidadeItens">0</strong>
        </div>

        <div class="total-area">

            <div class="total-label">
                TOTAL DA COMPRA
            </div>

            <div class="total">
                R$ <span id="total">0,00</span>
            </div>

        </div>

        <div class="botoes">

            <button
                class="btn cancelar"
                onclick="cancelarVenda()">
                CANCELAR
            </button>

            <button
                class="btn finalizar"
                onclick="abrirPagamento()">
                FINALIZAR VENDA
            </button>

        </div>

    </div>

</main>


<!-- MENU ESCONDIDO -->

<button class="menu-btn" onclick="abrirMenu()">
    ☰
</button>

<div id="menu" class="menu">

    <h3>Menu do Sistema</h3>

    <button onclick="alert('Cadastro de produtos será ativado nesta área.')">
        📦 Cadastro de Produtos
    </button>

    <button onclick="alert('Estoque será ativado nesta área.')">
        📊 Estoque
    </button>

    <button onclick="alert('Clientes será ativado nesta área.')">
        👥 Clientes
    </button>

    <button onclick="alert('Relatórios serão ativados nesta área.')">
        📈 Relatórios
    </button>

    <button onclick="alert('Configurações serão ativadas nesta área.')">
        ⚙️ Configurações
    </button>

</div>


<!-- PAGAMENTO -->

<div id="modal" class="modal">

    <div class="caixa-pagamento">

        <h2>Finalizar Venda</h2>

        <div class="valor-final">
            R$ <span id="valorPagamento">0,00</span>
        </div>

        <div class="forma">

            <button onclick="finalizar('Dinheiro')">
                💵 Dinheiro
            </button>

            <button onclick="finalizar('Pix')">
                📱 Pix
            </button>

            <button onclick="finalizar('Débito')">
                💳 Débito
            </button>

            <button onclick="finalizar('Crédito')">
                💳 Crédito
            </button>

        </div>

        <button
            class="btn cancelar fechar"
            onclick="fecharPagamento()">
            VOLTAR
        </button>

    </div>

</div>


<script>

/*
   PRODUTOS DE TESTE

   Depois vamos trocar isso pelo
   cadastro real de produtos.
*/

const produtos = {

    "7890000001":{
        nome:"Arroz 5kg",
        preco:25.00
    },

    "7890000002":{
        nome:"Feijão 1kg",
        preco:8.00
    },

    "7890000003":{
        nome:"Açúcar 1kg",
        preco:5.50
    }

};


let venda = [];


/* LEITOR DE CÓDIGO */

function lerCodigo(event){

    if(event.key === "Enter"){

        event.preventDefault();

        adicionarProduto();

    }

}


/* ADICIONAR PRODUTO */

function adicionarProduto(){

    const campo =
        document.getElementById("codigo");

    const codigo =
        campo.value.trim();

    if(codigo === ""){
        campo.focus();
        return;
    }


    let produto = produtos[codigo];


    /*
       Se ainda não estiver cadastrado,
       mostramos o código para cadastro.
    */

    if(!produto){

        alert(
            "Produto não cadastrado.\\n\\n" +
            "Código: " + codigo +
            "\\n\\n" +
            "Cadastre este produto no menu."
        );

        campo.value="";
        campo.focus();

        return;
    }


    const existente =
        venda.find(p => p.codigo === codigo);


    if(existente){

        existente.quantidade++;

    }else{

        venda.push({

            codigo:codigo,

            nome:produto.nome,

            preco:produto.preco,

            quantidade:1

        });

    }


    campo.value="";

    atualizarTela();

    campo.focus();

}


/* ATUALIZAR TELA */

function atualizarTela(){

    const lista =
        document.getElementById("lista");

    lista.innerHTML="";


    let total=0;

    let itens=0;


    venda.forEach((produto,index)=>{

        const subtotal =
            produto.preco * produto.quantidade;

        total += subtotal;

        itens += produto.quantidade;


        lista.innerHTML += `

        <tr>

            <td>${produto.codigo}</td>

            <td>${produto.nome}</td>

            <td>${produto.quantidade}</td>

            <td>R$ ${formatar(produto.preco)}</td>

            <td>
                R$ ${formatar(subtotal)}
            </td>

        </tr>

        `;

    });


    if(venda.length === 0){

        lista.innerHTML = `

        <tr>

            <td colspan="5" class="vazio">
                Passe o primeiro produto no leitor de código de barras
            </td>

        </tr>

        `;

    }


    document.getElementById("total")
        .innerText = formatar(total);


    document.getElementById("quantidadeItens")
        .innerText = itens;

}


/* FORMATAR DINHEIRO */

function formatar(valor){

    return valor
        .toFixed(2)
        .replace(".",",");

}


/* CANCELAR */

function cancelarVenda(){

    if(venda.length === 0){
        return;
    }

    if(confirm("Cancelar esta venda?")){

        venda=[];

        atualizarTela();

        document.getElementById("codigo").focus();

    }

}


/* PAGAMENTO */

function abrirPagamento(){

    if(venda.length === 0){

        alert("Nenhum produto foi registrado.");

        document.getElementById("codigo").focus();

        return;
    }


    let total=0;

    venda.forEach(produto=>{

        total += produto.preco * produto.quantidade;

    });


    document.getElementById("valorPagamento")
        .innerText = formatar(total);

    document.getElementById("modal")
        .classList.add("aberto");

}


/* FECHAR PAGAMENTO */

function fecharPagamento(){

    document.getElementById("modal")
        .classList.remove("aberto");

}


/* FINALIZAR */

function finalizar(forma){

    let total=0;

    venda.forEach(produto=>{

        total += produto.preco * produto.quantidade;

    });


    alert(
        "VENDA FINALIZADA!\\n\\n" +
        "Forma de pagamento: " + forma +
        "\\nTotal: R$ " + formatar(total)
    );


    venda=[];

    atualizarTela();

    fecharPagamento();

    document.getElementById("codigo").focus();

}


/* MENU */

function abrirMenu(){

    document
        .getElementById("menu")
        .classList.toggle("aberto");

}

</script>

</body>
</html>
