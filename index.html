<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Caixa Livre - Supermercado Val Bença</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: Arial, Helvetica, sans-serif;
    background: #090909;
}

/* ==============================
   TELA INICIAL
============================== */

#telaInicial {
    width: 100vw;
    height: 100vh;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;

    background:
        radial-gradient(
            circle at 50% 45%,
            rgba(255, 102, 0, 0.16),
            transparent 34%
        ),
        linear-gradient(
            135deg,
            #050505 0%,
            #111111 50%,
            #050505 100%
        );
}

/* brilho laranja superior */

#telaInicial::before {
    content: "";
    position: absolute;
    width: 420px;
    height: 420px;
    background: #ff6600;
    opacity: 0.07;
    filter: blur(100px);
    border-radius: 50%;
}

/* linha laranja */

#telaInicial::after {
    content: "";
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 5px;
    background: #ff6600;
    box-shadow: 0 0 25px rgba(255,102,0,.7);
}

/* ==============================
   CAIXA LIVRE
============================== */

.titulo-caixa {
    position: relative;
    z-index: 2;

    color: #ffffff;

    font-size: clamp(
        60px,
        11vw,
        155px
    );

    font-weight: 900;

    letter-spacing: 5px;

    text-align: center;

    text-shadow:
        0 0 20px rgba(255,102,0,.18);
}

/* detalhe laranja */

.titulo-caixa::after {
    content: "";
    display: block;

    width: 150px;
    height: 6px;

    margin: 18px auto 0;

    background: #ff6600;

    border-radius: 20px;

    box-shadow:
        0 0 18px rgba(255,102,0,.65);
}

/* ==============================
   GT DELIVERY
============================== */

.gt {
    position: absolute;

    right: 25px;
    bottom: 22px;

    color: #ff6600;

    font-size: 13px;

    font-weight: 800;

    letter-spacing: 1px;

    opacity: .65;

    z-index: 5;
}

.gt span {
    color: #fff;
    opacity: .75;
}

/* ==============================
   LEITOR INVISÍVEL
============================== */

#scannerInput {
    position: fixed;

    left: -9999px;
    top: -9999px;

    width: 1px;
    height: 1px;

    opacity: 0;

    border: 0;
    outline: none;
}

/* ==============================
   TELA DE VENDA
============================== */

#telaVenda {
    display: none;

    width: 100vw;
    height: 100vh;

    padding: 25px;

    color: white;

    background:
        radial-gradient(
            circle at 80% 10%,
            rgba(255,102,0,.12),
            transparent 30%
        ),
        #0b0b0b;

    overflow-y: auto;
}

/* topo */

.cabecalho-venda {
    display: flex;

    justify-content: space-between;

    align-items: center;

    padding-bottom: 20px;

    border-bottom: 1px solid #292929;

    margin-bottom: 25px;
}

.cabecalho-venda h1 {
    font-size: 38px;

    font-weight: 900;
}

.supermercado {
    color: #aaa;

    font-size: 14px;

    margin-top: 5px;
}

/* GT dentro da venda */

.cabecalho-venda .gt {
    position: static;

    color: #ff6600;

    opacity: 1;
}

/* ==============================
   TABELA
============================== */

#listaProdutos {
    width: 100%;

    border-collapse: collapse;

    background: #111;
}

#listaProdutos th {
    text-align: left;

    padding: 14px;

    background: #ff6600;

    color: #fff;

    font-size: 15px;
}

#listaProdutos td {
    padding: 15px 14px;

    border-bottom: 1px solid #292929;

    font-size: 18px;

    color: #eee;
}

/* ==============================
   TOTAL
============================== */

.total-area {
    margin-top: 28px;

    text-align: right;
}

.total-label {
    color: #999;

    font-size: 16px;

    font-weight: bold;
}

.total {
    color: #ff6600;

    font-size: 58px;

    font-weight: 900;

    margin-top: 5px;

    text-shadow:
        0 0 20px rgba(255,102,0,.25);
}

/* ==============================
   BOTÕES
============================== */

.botoes {
    display: flex;

    gap: 12px;

    justify-content: flex-end;

    margin-top: 25px;
}

button {
    border: none;

    padding: 15px 25px;

    border-radius: 8px;

    font-size: 16px;

    font-weight: 800;

    cursor: pointer;
}

.cancelar {
    background: #292929;

    color: #fff;
}

.finalizar {
    background: #ff6600;

    color: #fff;

    box-shadow:
        0 5px 20px rgba(255,102,0,.25);
}

/* ==============================
   MENSAGEM
============================== */

#mensagem {
    position: fixed;

    left: 50%;
    bottom: 35px;

    transform: translateX(-50%);

    background: #ff6600;

    color: white;

    padding: 13px 22px;

    border-radius: 8px;

    display: none;

    font-weight: bold;

    z-index: 50;
}

/* ==============================
   PAGAMENTO
============================== */

#modalPagamento,
#modalCadastro {
    display: none;

    position: fixed;

    inset: 0;

    background: rgba(0,0,0,.78);

    align-items: center;

    justify-content: center;

    z-index: 100;
}

.modal,
.cadastro {
    background: #151515;

    color: white;

    width: min(450px, 92%);

    padding: 30px;

    border-radius: 15px;

    border: 1px solid #333;

    box-shadow:
        0 20px 80px rgba(0,0,0,.6);
}

.modal h2,
.cadastro h2 {
    margin-bottom: 20px;

    font-size: 28px;
}

.pagamento {
    width: 100%;

    margin-bottom: 10px;

    background: #ff6600;

    color: white;
}

.fechar,
.fecharCadastro {
    width: 100%;

    background: #292929;

    color: white;

    margin-top: 10px;
}

/* cadastro */

.cadastro input {
    width: 100%;

    padding: 13px;

    margin-bottom: 10px;

    border: 1px solid #444;

    background: #0b0b0b;

    color: white;

    border-radius: 7px;

    font-size: 16px;
}

.salvar {
    width: 100%;

    background: #ff6600;

    color: white;
}

/* ==============================
   CELULAR
============================== */

@media (max-width: 700px) {

    .titulo-caixa {
        font-size: 48px;

        letter-spacing: 2px;
    }

    .titulo-caixa::after {
        width: 100px;
        height: 4px;
    }

    .gt {
        right: 15px;
        bottom: 15px;
        font-size: 11px;
    }

    #telaVenda {
        padding: 15px;
    }

    .cabecalho-venda h1 {
        font-size: 28px;
    }

    #listaProdutos th,
    #listaProdutos td {
        padding: 10px 7px;

        font-size: 14px;
    }

    .total {
        font-size: 45px;
    }

    .botoes {
        flex-direction: column;
    }

    button {
        width: 100%;
    }
}
</style>
</head>

<body>

<!-- =================================
     TELA INICIAL
================================= -->

<div id="telaInicial">

    <div class="titulo-caixa">
        CAIXA LIVRE
    </div>

    <div class="gt">
        GT <span>Delivery</span>
    </div>

</div>

<!-- LEITOR -->
<input
    id="scannerInput"
    type="text"
    autocomplete="off"
    autofocus
>

<!-- =================================
     VENDA
================================= -->

<div id="telaVenda">

    <div class="cabecalho-venda">

        <div>
            <h1>CAIXA LIVRE</h1>

            <div class="supermercado">
                Supermercado Val Bença
            </div>
        </div>

        <div class="gt">
            GT <span>Delivery</span>
        </div>

    </div>

    <table id="listaProdutos">

        <thead>

            <tr>
                <th>Produto</th>
                <th>Qtd.</th>
                <th>Preço</th>
                <th>Total</th>
            </tr>

        </thead>

        <tbody id="produtosBody"></tbody>

    </table>

    <div class="total-area">

        <div class="total-label">
            TOTAL DA VENDA
        </div>

        <div class="total" id="totalVenda">
            R$ 0,00
        </div>

    </div>

    <div class="botoes">

        <button
            class="cancelar"
            onclick="cancelarVenda()"
        >
            CANCELAR
        </button>

        <button
            class="finalizar"
            onclick="abrirPagamento()"
        >
            FINALIZAR VENDA
        </button>

    </div>

</div>

<!-- MENSAGEM -->

<div id="mensagem"></div>

<!-- =================================
     PAGAMENTO
================================= -->

<div id="modalPagamento">

    <div class="modal">

        <h2>Forma de pagamento</h2>

        <button
            class="pagamento"
            onclick="finalizarVenda('Dinheiro')"
        >
            DINHEIRO
        </button>

        <button
            class="pagamento"
            onclick="finalizarVenda('Pix')"
        >
            PIX
        </button>

        <button
            class="pagamento"
            onclick="finalizarVenda('Débito')"
        >
            CARTÃO DE DÉBITO
        </button>

        <button
            class="pagamento"
            onclick="finalizarVenda('Crédito')"
        >
            CARTÃO DE CRÉDITO
        </button>

        <button
            class="fechar"
            onclick="fecharPagamento()"
        >
            VOLTAR
        </button>

    </div>

</div>

<!-- =================================
     CADASTRO ESCONDIDO
================================= -->

<div id="modalCadastro">

    <div class="cadastro">

        <h2>Cadastrar produto</h2>

        <input
            id="cadCodigo"
            placeholder="Código de barras"
        >

        <input
            id="cadNome"
            placeholder="Nome do produto"
        >

        <input
            id="cadPreco"
            type="number"
            step="0.01"
            placeholder="Preço"
        >

        <input
            id="cadEstoque"
            type="number"
            placeholder="Estoque"
        >

        <button
            class="salvar"
            onclick="cadastrarProduto()"
        >
            SALVAR PRODUTO
        </button>

        <button
            class="fecharCadastro"
            onclick="fecharCadastro()"
        >
            FECHAR
        </button>

    </div>

</div>

<script>

/* =================================
   SUPABASE
================================= */

const SUPABASE_URL =
"https://cgdvehummqfttsyfebfo.supabase.co";

const SUPABASE_KEY =
"sb_publishable_rzYfEMq3RKJwlVPOmMQaUA_AAxWN9nr";

const supabaseClient =
supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* =================================
   VARIÁVEIS
================================= */

let venda = [];

const scanner =
document.getElementById("scannerInput");


/* =================================
   FOCO DO LEITOR
================================= */

function focarScanner() {
    scanner.focus();
}

window.addEventListener(
    "load",
    focarScanner
);

document.addEventListener(
    "click",
    focarScanner
);


/* =================================
   LEITOR
================================= */

scanner.addEventListener(
    "keydown",
    async function(event) {

        if (event.key !== "Enter") {
            return;
        }

        const codigo =
            scanner.value.trim();

        scanner.value = "";

        if (!codigo) {
            focarScanner();
            return;
        }

        await procurarProduto(codigo);

        focarScanner();
    }
);


/* =================================
   PESQUISAR PRODUTO
================================= */

async function procurarProduto(codigo) {

    const { data, error } =
        await supabaseClient
        .from("dav_produtos")
        .select("*")
        .eq("codigo_barras", codigo)
        .eq("ativo", true)
        .maybeSingle();

    if (error) {

        console.error(error);

        mostrarMensagem(
            "Erro ao consultar produto."
        );

        return;
    }

    if (!data) {

        mostrarMensagem(
            "Produto não cadastrado."
        );

        return;
    }

    adicionarProduto(data);
}


/* =================================
   ADICIONAR
================================= */

function adicionarProduto(produto) {

    const existente =
        venda.find(
            item =>
            item.id === produto.id
        );

    if (existente) {

        existente.quantidade++;

    } else {

        venda.push({

            ...produto,

            quantidade: 1

        });

    }

    mostrarVenda();
}


/* =================================
   MOSTRAR VENDA
================================= */

function mostrarVenda() {

    document.getElementById(
        "telaInicial"
    ).style.display = "none";

    document.getElementById(
        "telaVenda"
    ).style.display = "block";

    const body =
        document.getElementById(
            "produtosBody"
        );

    body.innerHTML = "";

    let total = 0;

    venda.forEach(item => {

        const subtotal =
            Number(item.preco) *
            item.quantidade;

        total += subtotal;

        const tr =
            document.createElement("tr");

        tr.innerHTML = `

            <td>${item.nome}</td>

            <td>${item.quantidade}</td>

            <td>
                ${formatarMoeda(item.preco)}
            </td>

            <td>
                ${formatarMoeda(subtotal)}
            </td>

        `;

        body.appendChild(tr);

    });

    document.getElementById(
        "totalVenda"
    ).textContent =
        formatarMoeda(total);
}


/* =================================
   MOEDA
================================= */

function formatarMoeda(valor) {

    return Number(valor).toLocaleString(
        "pt-BR",
        {
            style: "currency",
            currency: "BRL"
        }
    );
}


/* =================================
   CANCELAR
================================= */

function cancelarVenda() {

    if (!venda.length) {
        voltarCaixa();
        return;
    }

    if (
        !confirm(
            "Cancelar esta venda?"
        )
    ) {
        return;
    }

    voltarCaixa();
}


/* =================================
   VOLTAR
================================= */

function voltarCaixa() {

    venda = [];

    document.getElementById(
        "telaVenda"
    ).style.display = "none";

    document.getElementById(
        "telaInicial"
    ).style.display = "flex";

    focarScanner();
}


/* =================================
   PAGAMENTO
================================= */

function abrirPagamento() {

    if (!venda.length) {
        return;
    }

    document.getElementById(
        "modalPagamento"
    ).style.display = "flex";
}


function fecharPagamento() {

    document.getElementById(
        "modalPagamento"
    ).style.display = "none";

    focarScanner();
}


/* =================================
   FINALIZAR
================================= */

async function finalizarVenda(
    formaPagamento
) {

    if (!venda.length) {
        return;
    }

    mostrarMensagem(
        "Venda finalizada • " +
        formaPagamento
    );

    document.getElementById(
        "modalPagamento"
    ).style.display = "none";

    setTimeout(
        voltarCaixa,
        1200
    );
}


/* =================================
   MENSAGEM
================================= */

function mostrarMensagem(texto) {

    const mensagem =
        document.getElementById(
            "mensagem"
        );

    mensagem.textContent =
        texto;

    mensagem.style.display =
        "block";

    setTimeout(
        () => {
            mensagem.style.display =
                "none";
        },
        2200
    );
}


/* =================================
   CADASTRO - F2
================================= */

document.addEventListener(
    "keydown",
    function(event) {

        if (event.key === "F2") {

            event.preventDefault();

            abrirCadastro();
        }

    }
);


function abrirCadastro() {

    document.getElementById(
        "modalCadastro"
    ).style.display =
        "flex";
}


function fecharCadastro() {

    document.getElementById(
        "modalCadastro"
    ).style.display =
        "none";

    focarScanner();
}


/* =================================
   CADASTRAR PRODUTO
================================= */

async function cadastrarProduto() {

    const codigo =
        document.getElementById(
            "cadCodigo"
        ).value.trim();

    const nome =
        document.getElementById(
            "cadNome"
        ).value.trim();

    const preco =
        Number(
            document.getElementById(
                "cadPreco"
            ).value
        );

    const estoque =
        Number(
            document.getElementById(
                "cadEstoque"
            ).value
        );

    if (
        !codigo ||
        !nome ||
        !preco
    ) {

        alert(
            "Preencha código, nome e preço."
        );

        return;
    }

    const { error } =
        await supabaseClient
        .from("dav_produtos")
        .insert({

            codigo_barras: codigo,

            nome: nome,

            preco: preco,

            estoque: estoque,

            ativo: true

        });

    if (error) {

        console.error(error);

        alert(
            "Não foi possível cadastrar."
        );

        return;
    }

    alert(
        "Produto cadastrado com sucesso!"
    );

    document.getElementById(
        "cadCodigo"
    ).value = "";

    document.getElementById(
        "cadNome"
    ).value = "";

    document.getElementById(
        "cadPreco"
    ).value = "";

    document.getElementById(
        "cadEstoque"
    ).value = "";

    fecharCadastro();
}

</script>

</body>
</html>
