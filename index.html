<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Caixa Livre - Supermercado Val Bença</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: #ffffff;
    color: #111;
    min-height: 100vh;
    overflow: hidden;
}

/* TELA INICIAL */
#telaInicial {
    width: 100vw;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    background: #fff;
}

.titulo-caixa {
    font-size: clamp(55px, 10vw, 150px);
    font-weight: 900;
    letter-spacing: 4px;
    text-align: center;
}

.gt {
    position: absolute;
    right: 20px;
    bottom: 15px;
    font-size: 12px;
    font-weight: 700;
    opacity: 0.45;
}

/* CAMPO INVISÍVEL DO LEITOR */
#scannerInput {
    position: fixed;
    left: -9999px;
    top: -9999px;
    width: 1px;
    height: 1px;
    opacity: 0;
    border: 0;
    outline: none;
}

/* VENDA */
#telaVenda {
    display: none;
    width: 100vw;
    height: 100vh;
    padding: 25px;
    background: #fff;
    overflow-y: auto;
}

.cabecalho-venda {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 25px;
}

.cabecalho-venda h1 {
    font-size: 38px;
    font-weight: 900;
}

.supermercado {
    font-size: 14px;
    font-weight: bold;
    opacity: .6;
}

#listaProdutos {
    width: 100%;
    border-collapse: collapse;
}

#listaProdutos th {
    text-align: left;
    padding: 12px;
    background: #111;
    color: white;
}

#listaProdutos td {
    padding: 14px 12px;
    border-bottom: 1px solid #ddd;
    font-size: 18px;
}

.total-area {
    margin-top: 25px;
    text-align: right;
}

.total-label {
    font-size: 18px;
}

.total {
    font-size: 55px;
    font-weight: 900;
    margin-top: 5px;
}

.botoes {
    display: flex;
    gap: 12px;
    justify-content: flex-end;
    margin-top: 25px;
}

button {
    border: none;
    padding: 15px 25px;
    border-radius: 8px;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
}

.cancelar {
    background: #ddd;
}

.finalizar {
    background: #111;
    color: white;
}

/* MENSAGEM */
#mensagem {
    position: fixed;
    left: 50%;
    bottom: 35px;
    transform: translateX(-50%);
    background: #111;
    color: white;
    padding: 13px 22px;
    border-radius: 8px;
    display: none;
    font-weight: bold;
    z-index: 20;
}

/* MODAL PAGAMENTO */
#modalPagamento {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.65);
    align-items: center;
    justify-content: center;
    z-index: 30;
}

.modal {
    background: white;
    width: min(450px, 90%);
    padding: 30px;
    border-radius: 15px;
}

.modal h2 {
    margin-bottom: 20px;
    font-size: 28px;
}

.pagamento {
    width: 100%;
    margin-bottom: 10px;
    background: #111;
    color: white;
}

.fechar {
    width: 100%;
    background: #ddd;
    margin-top: 10px;
}

/* CADASTRO ESCONDIDO */
#modalCadastro {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.65);
    align-items: center;
    justify-content: center;
    z-index: 40;
}

.cadastro {
    background: white;
    width: min(500px, 92%);
    padding: 30px;
    border-radius: 15px;
}

.cadastro h2 {
    margin-bottom: 20px;
}

.cadastro input {
    width: 100%;
    padding: 13px;
    margin-bottom: 10px;
    border: 1px solid #ccc;
    border-radius: 7px;
    font-size: 16px;
}

.salvar {
    width: 100%;
    background: #111;
    color: white;
}

.fecharCadastro {
    width: 100%;
    margin-top: 10px;
    background: #ddd;
}
</style>
</head>

<body>

<!-- TELA INICIAL -->
<div id="telaInicial">

    <div class="titulo-caixa">
        CAIXA LIVRE
    </div>

    <div class="gt">
        GT Delivery
    </div>

</div>

<!-- LEITOR DE CÓDIGO DE BARRAS -->
<input
    id="scannerInput"
    type="text"
    autocomplete="off"
    autofocus
>

<!-- TELA DA VENDA -->
<div id="telaVenda">

    <div class="cabecalho-venda">
        <div>
            <h1>CAIXA LIVRE</h1>
            <div class="supermercado">
                Supermercado Val Bença
            </div>
        </div>

        <div class="gt">
            GT Delivery
        </div>
    </div>

    <table id="listaProdutos">
        <thead>
            <tr>
                <th>Produto</th>
                <th>Qtd.</th>
                <th>Preço</th>
                <th>Total</th>
            </tr>
        </thead>

        <tbody id="produtosBody"></tbody>
    </table>

    <div class="total-area">
        <div class="total-label">TOTAL DA VENDA</div>
        <div class="total" id="totalVenda">
            R$ 0,00
        </div>
    </div>

    <div class="botoes">
        <button class="cancelar" onclick="cancelarVenda()">
            CANCELAR
        </button>

        <button class="finalizar" onclick="abrirPagamento()">
            FINALIZAR VENDA
        </button>
    </div>

</div>

<!-- MENSAGEM -->
<div id="mensagem"></div>

<!-- PAGAMENTO -->
<div id="modalPagamento">

    <div class="modal">

        <h2>Forma de pagamento</h2>

        <button class="pagamento" onclick="finalizarVenda('Dinheiro')">
            DINHEIRO
        </button>

        <button class="pagamento" onclick="finalizarVenda('Pix')">
            PIX
        </button>

        <button class="pagamento" onclick="finalizarVenda('Débito')">
            CARTÃO DE DÉBITO
        </button>

        <button class="pagamento" onclick="finalizarVenda('Crédito')">
            CARTÃO DE CRÉDITO
        </button>

        <button class="fechar" onclick="fecharPagamento()">
            VOLTAR
        </button>

    </div>

</div>

<!-- CADASTRO ESCONDIDO -->
<div id="modalCadastro">

    <div class="cadastro">

        <h2>Cadastrar produto</h2>

        <input id="cadCodigo" placeholder="Código de barras">

        <input id="cadNome" placeholder="Nome do produto">

        <input id="cadPreco" type="number" step="0.01" placeholder="Preço">

        <input id="cadEstoque" type="number" placeholder="Estoque">

        <button class="salvar" onclick="cadastrarProduto()">
            SALVAR PRODUTO
        </button>

        <button class="fecharCadastro" onclick="fecharCadastro()">
            FECHAR
        </button>

    </div>

</div>

<script>

/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
    "https://cgdvehummqfttsyfebfo.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_rzYfEMq3RKJwlVPOmMQaUA_AAxWN9nr";

const supabaseClient =
    supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =========================
   VARIÁVEIS
========================= */

let venda = [];

const scanner =
    document.getElementById("scannerInput");


/* =========================
   FOCO NO LEITOR
========================= */

function focarScanner() {
    scanner.focus();
}

window.addEventListener("load", () => {
    focarScanner();
});

document.addEventListener("click", () => {
    focarScanner();
});


/* =========================
   RECEBER CÓDIGO DO LEITOR
========================= */

scanner.addEventListener("keydown", async function(event) {

    if (event.key !== "Enter") {
        return;
    }

    const codigo =
        scanner.value.trim();

    scanner.value = "";

    if (!codigo) {
        focarScanner();
        return;
    }

    await procurarProduto(codigo);

    focarScanner();
});


/* =========================
   PROCURAR PRODUTO
========================= */

async function procurarProduto(codigo) {

    const { data, error } =
        await supabaseClient
            .from("dav_produtos")
            .select("*")
            .eq("codigo_barras", codigo)
            .eq("ativo", true)
            .maybeSingle();

    if (error) {

        mostrarMensagem(
            "Erro ao consultar produto."
        );

        console.error(error);

        return;
    }

    if (!data) {

        mostrarMensagem(
            "Produto não cadastrado."
        );

        return;
    }

    adicionarProduto(data);
}


/* =========================
   ADICIONAR PRODUTO
========================= */

function adicionarProduto(produto) {

    const existente =
        venda.find(
            item =>
                item.id === produto.id
        );

    if (existente) {

        existente.quantidade++;

    } else {

        venda.push({
            ...produto,
            quantidade: 1
        });

    }

    mostrarVenda();
}


/* =========================
   MOSTRAR VENDA
========================= */

function mostrarVenda() {

    document.getElementById(
        "telaInicial"
    ).style.display = "none";

    document.getElementById(
        "telaVenda"
    ).style.display = "block";

    const body =
        document.getElementById(
            "produtosBody"
        );

    body.innerHTML = "";

    let total = 0;

    venda.forEach(item => {

        const subtotal =
            Number(item.preco) *
            item.quantidade;

        total += subtotal;

        const tr =
            document.createElement("tr");

        tr.innerHTML = `
            <td>${item.nome}</td>
            <td>${item.quantidade}</td>
            <td>${formatarMoeda(item.preco)}</td>
            <td>${formatarMoeda(subtotal)}</td>
        `;

        body.appendChild(tr);

    });

    document.getElementById(
        "totalVenda"
    ).textContent =
        formatarMoeda(total);
}


/* =========================
   MOEDA
========================= */

function formatarMoeda(valor) {

    return Number(valor).toLocaleString(
        "pt-BR",
        {
            style: "currency",
            currency: "BRL"
        }
    );
}


/* =========================
   CANCELAR
========================= */

function cancelarVenda() {

    if (!venda.length) {
        voltarCaixa();
        return;
    }

    if (
        !confirm(
            "Cancelar esta venda?"
        )
    ) {
        return;
    }

    venda = [];

    voltarCaixa();
}


/* =========================
   VOLTAR PARA CAIXA LIVRE
========================= */

function voltarCaixa() {

    venda = [];

    document.getElementById(
        "telaVenda"
    ).style.display = "none";

    document.getElementById(
        "telaInicial"
    ).style.display = "flex";

    focarScanner();
}


/* =========================
   PAGAMENTO
========================= */

function abrirPagamento() {

    if (!venda.length) {
        return;
    }

    document.getElementById(
        "modalPagamento"
    ).style.display = "flex";
}


function fecharPagamento() {

    document.getElementById(
        "modalPagamento"
    ).style.display = "none";

    focarScanner();
}


/* =========================
   FINALIZAR VENDA
========================= */

async function finalizarVenda(formaPagamento) {

    if (!venda.length) {
        return;
    }

    /*
      Aqui podemos posteriormente
      registrar a venda completa
      no Supabase.
    */

    mostrarMensagem(
        "Venda finalizada • " +
        formaPagamento
    );

    document.getElementById(
        "modalPagamento"
    ).style.display = "none";

    setTimeout(() => {

        voltarCaixa();

    }, 1200);
}


/* =========================
   MENSAGEM
========================= */

function mostrarMensagem(texto) {

    const mensagem =
        document.getElementById(
            "mensagem"
        );

    mensagem.textContent = texto;

    mensagem.style.display = "block";

    setTimeout(() => {

        mensagem.style.display = "none";

    }, 2200);
}


/* =========================
   CADASTRO ESCONDIDO
   F2 NO COMPUTADOR
========================= */

document.addEventListener(
    "keydown",
    function(event) {

        if (event.key === "F2") {

            event.preventDefault();

            abrirCadastro();
        }

    }
);


function abrirCadastro() {

    document.getElementById(
        "modalCadastro"
    ).style.display = "flex";
}


function fecharCadastro() {

    document.getElementById(
        "modalCadastro"
    ).style.display = "none";

    focarScanner();
}


/* =========================
   CADASTRAR PRODUTO
========================= */

async function cadastrarProduto() {

    const codigo =
        document.getElementById(
            "cadCodigo"
        ).value.trim();

    const nome =
        document.getElementById(
            "cadNome"
        ).value.trim();

    const preco =
        Number(
            document.getElementById(
                "cadPreco"
            ).value
        );

    const estoque =
        Number(
            document.getElementById(
                "cadEstoque"
            ).value
        );

    if (!codigo || !nome || !preco) {

        alert(
            "Preencha código, nome e preço."
        );

        return;
    }

    const { error } =
        await supabaseClient
            .from("dav_produtos")
            .insert({
                codigo_barras: codigo,
                nome: nome,
                preco: preco,
                estoque: estoque,
                ativo: true
            });

    if (error) {

        console.error(error);

        alert(
            "Não foi possível cadastrar."
        );

        return;
    }

    alert(
        "Produto cadastrado com sucesso!"
    );

    document.getElementById(
        "cadCodigo"
    ).value = "";

    document.getElementById(
        "cadNome"
    ).value = "";

    document.getElementById(
        "cadPreco"
    ).value = "";

    document.getElementById(
        "cadEstoque"
    ).value = "";

    fecharCadastro();
}

</script>

</body>
</html>
