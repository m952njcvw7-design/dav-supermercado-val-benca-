<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DAV - Supermercado Val Bença</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#fff;
    font-family:Arial,sans-serif;
}

/* =====================================================
   TELA PRINCIPAL
===================================================== */

#inicio{
    width:100vw;
    height:100vh;
    position:relative;
    background-image:url("dav-val-benca.jpg");
    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
}

/* =====================================================
   ÁREAS CLICÁVEIS SOBRE A ARTE
===================================================== */

.area{
    position:absolute;
    cursor:pointer;
    background:transparent;
    border:none;
}

/* VENDAS */
.vendas{
    left:16.5%;
    top:28%;
    width:18.5%;
    height:29%;
}

/* PRODUTOS */
.produtos{
    left:36.5%;
    top:28%;
    width:18.5%;
    height:29%;
}

/* FINANCEIRO */
.financeiro{
    left:56.5%;
    top:28%;
    width:18.5%;
    height:29%;
}

/* RELATÓRIOS */
.relatorios{
    left:16.5%;
    top:61%;
    width:18.5%;
    height:28%;
}

/* CONFIGURAÇÕES */
.config{
    left:36.5%;
    top:61%;
    width:18.5%;
    height:28%;
}

/* =====================================================
   MENU LATERAL
===================================================== */

.menu-inicio{
    left:0;
    top:22%;
    width:14%;
    height:8%;
}

.menu-vendas{
    left:0;
    top:30%;
    width:14%;
    height:8%;
}

.menu-produtos{
    left:0;
    top:38%;
    width:14%;
    height:8%;
}

/* =====================================================
   TRÊS PONTINHOS
===================================================== */

.tres-pontos{
    position:absolute;
    right:1.5%;
    top:4%;
    width:45px;
    height:45px;
    border:none;
    border-radius:50%;
    background:rgba(0,0,0,.25);
    color:white;
    font-size:30px;
    cursor:pointer;
    z-index:20;
}

.tres-pontos:hover{
    background:rgba(0,0,0,.45);
}

/* =====================================================
   MENU DE VENDAS DO DIA
===================================================== */

.menu{
    display:none;
    position:absolute;
    right:1.5%;
    top:10%;
    width:250px;
    background:white;
    border-radius:12px;
    box-shadow:0 8px 30px rgba(0,0,0,.35);
    overflow:hidden;
    z-index:50;
}

.menu.aberto{
    display:block;
}

.menu button{
    width:100%;
    padding:17px;
    border:none;
    background:white;
    text-align:left;
    font-size:15px;
    cursor:pointer;
}

.menu button:hover{
    background:#f2f2f2;
}

/* =====================================================
   TELA DE VENDAS
===================================================== */

#vendasTela{
    display:none;
    width:100vw;
    height:100vh;
    background:#f5f5f5;
    position:relative;
}

/* Cabeçalho */
.topo{
    height:15%;
    background:#064aa3;
    color:white;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 3%;
}

.topo h1{
    font-size:clamp(20px,2.5vw,38px);
}

.topo small{
    display:block;
    margin-top:5px;
}

/* =====================================================
   ÁREA DA VENDA
===================================================== */

.venda{
    height:70%;
    display:grid;
    grid-template-columns:65% 35%;
    gap:15px;
    padding:18px;
}

/* Produtos */
.lista{
    background:white;
    border-radius:12px;
    overflow:hidden;
    box-shadow:0 3px 10px rgba(0,0,0,.12);
}

.lista-titulo{
    background:#064aa3;
    color:white;
    padding:15px;
    font-weight:bold;
}

#produtosVenda{
    height:calc(100% - 55px);
    overflow-y:auto;
}

.produto{
    display:grid;
    grid-template-columns:1fr 80px 120px 40px;
    padding:15px;
    border-bottom:1px solid #ddd;
    align-items:center;
}

.produto strong{
    color:#064aa3;
}

.produto button{
    border:none;
    background:#eee;
    border-radius:5px;
    height:30px;
    cursor:pointer;
}

/* =====================================================
   PAGAMENTO
===================================================== */

.resumo{
    background:white;
    border-radius:12px;
    box-shadow:0 3px 10px rgba(0,0,0,.12);
    overflow:hidden;
}

.total{
    background:#064aa3;
    color:white;
    padding:25px;
}

.total span{
    display:block;
    font-size:14px;
}

#valorTotal{
    font-size:38px;
    font-weight:bold;
    margin-top:8px;
}

.pagamento{
    padding:20px;
}

.pagamento h3{
    color:#064aa3;
    margin-bottom:12px;
}

.pagamento button{
    width:48%;
    padding:13px;
    margin:1%;
    border:2px solid #064aa3;
    border-radius:7px;
    background:white;
    cursor:pointer;
    font-weight:bold;
}

.pagamento button.selecionado{
    background:#ffd400;
}

.finalizar{
    width:94%;
    margin:15px 3%;
    padding:16px;
    background:#064aa3;
    color:white;
    border:none;
    border-radius:8px;
    font-weight:bold;
    font-size:16px;
    cursor:pointer;
}

/* =====================================================
   LEITOR
===================================================== */

.leitor{
    position:absolute;
    left:18px;
    right:18px;
    bottom:10px;
    height:11%;
    display:flex;
    gap:10px;
}

.leitor input{
    flex:1;
    border:2px solid #064aa3;
    border-radius:8px;
    padding:15px;
    font-size:17px;
}

.leitor button{
    width:180px;
    border:none;
    border-radius:8px;
    background:#ffd400;
    color:#064aa3;
    font-weight:bold;
    cursor:pointer;
}

/* =====================================================
   VENDAS DO DIA
===================================================== */

#modalVendas{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.65);
    z-index:100;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.caixaVendas{
    width:min(700px,100%);
    max-height:85vh;
    background:white;
    border-radius:14px;
    overflow:hidden;
}

.cabecalhoVendas{
    background:#064aa3;
    color:white;
    padding:18px;
    display:flex;
    justify-content:space-between;
}

.cabecalhoVendas button{
    background:none;
    border:none;
    color:white;
    font-size:25px;
    cursor:pointer;
}

#listaVendas{
    padding:20px;
    max-height:70vh;
    overflow-y:auto;
}

.vendaDia{
    border:1px solid #ddd;
    border-radius:8px;
    padding:15px;
    margin-bottom:10px;
}

.vendaDia strong{
    color:#064aa3;
}

@media(max-width:800px){

    .venda{
        grid-template-columns:1fr;
        overflow:auto;
    }

    .resumo{
        order:-1;
    }

    .topo{
        height:12%;
    }

    .leitor{
        position:relative;
        bottom:auto;
        height:auto;
        padding:10px;
    }
}
</style>
</head>

<body>

<!-- =====================================================
     INÍCIO — A PRÓPRIA ARTE
===================================================== -->

<section id="inicio">

    <!-- três pontinhos -->
    <button class="tres-pontos" onclick="abrirMenu()">
        ⋮
    </button>

    <!-- áreas clicáveis -->

    <button
        class="area vendas"
        onclick="abrirVendas()">
    </button>

    <button
        class="area produtos"
        onclick="mensagem('Produtos')">
    </button>

    <button
        class="area financeiro"
        onclick="mensagem('Financeiro')">
    </button>

    <button
        class="area relatorios"
        onclick="mensagem('Relatórios')">
    </button>

    <button
        class="area config"
        onclick="mensagem('Configurações')">
    </button>

</section>


<!-- =====================================================
     TELA DE VENDAS
===================================================== -->

<section id="vendasTela">

    <header class="topo">

        <div>
            <h1>Supermercado Val Bença</h1>
            <small>DAV • Administração de Vendas</small>
        </div>

        <button
            class="tres-pontos"
            onclick="abrirMenuVendas()">
            ⋮
        </button>

    </header>


    <div class="venda">

        <!-- PRODUTOS BIPADOS -->

        <div class="lista">

            <div class="lista-titulo">
                PRODUTOS DA VENDA
            </div>

            <div id="produtosVenda">

                <div
                    id="vazio"
                    style="
                    text-align:center;
                    padding:80px 20px;
                    color:#888;">
                    
                    Passe os produtos no leitor.

                </div>

            </div>

        </div>


        <!-- RESUMO -->

        <div class="resumo">

            <div class="total">

                <span>TOTAL DA VENDA</span>

                <div id="valorTotal">
                    R$ 0,00
                </div>

            </div>


            <div class="pagamento">

                <h3>Forma de pagamento</h3>

                <button onclick="pagamento(this,'Dinheiro')">
                    💵 Dinheiro
                </button>

                <button onclick="pagamento(this,'Pix')">
                    📱 Pix
                </button>

                <button onclick="pagamento(this,'Débito')">
                    💳 Débito
                </button>

                <button onclick="pagamento(this,'Crédito')">
                    💳 Crédito
                </button>

            </div>

            <button
                class="finalizar"
                onclick="finalizarVenda()">

                FINALIZAR VENDA

            </button>

        </div>

    </div>


    <!-- LEITOR -->

    <div class="leitor">

        <input
            id="codigo"
            placeholder="Passe o produto no leitor ou digite o código"
            autocomplete="off">

        <button onclick="bipar()">
            BIPAR PRODUTO
        </button>

    </div>

</section>


<!-- =====================================================
     MENU
===================================================== -->

<div
    class="menu"
    id="menu">

    <button onclick="abrirVendasDoDia()">
        📋 Vendas do dia
    </button>

    <button onclick="mensagem('Consulta de produtos')">
        🔎 Consulta de produtos
    </button>

    <button onclick="mensagem('Configurações')">
        ⚙️ Configurações
    </button>

</div>


<!-- =====================================================
     MODAL VENDAS DO DIA
===================================================== -->

<div id="modalVendas">

    <div class="caixaVendas">

        <div class="cabecalhoVendas">

            <strong>
                Vendas do dia
            </strong>

            <button onclick="fecharVendas()">
                ×
            </button>

        </div>

        <div id="listaVendas"></div>

    </div>

</div>


<script>

/* =====================================================
   PRODUTOS
===================================================== */

const banco = {

    "7891000100103":{
        nome:"Arroz Branco 5kg",
        preco:27.90
    },

    "7891000100202":{
        nome:"Feijão Carioca 1kg",
        preco:8.49
    },

    "7891000100301":{
        nome:"Açúcar Cristal 1kg",
        preco:4.99
    },

    "7891000100400":{
        nome:"Café 500g",
        preco:16.90
    },

    "7891000100509":{
        nome:"Leite Integral 1L",
        preco:5.49
    }

};

let carrinho = [];

let formaPagamento = "";

let vendas = [];


/* =====================================================
   MENU
===================================================== */

function abrirMenu(){

    document
        .getElementById("menu")
        .classList.toggle("aberto");

}


/* =====================================================
   ABRIR VENDAS
===================================================== */

function abrirVendas(){

    document
        .getElementById("inicio")
        .style.display="none";

    document
        .getElementById("vendasTela")
        .style.display="block";

}


/* =====================================================
   MENU DA TELA DE VENDAS
===================================================== */

function abrirMenuVendas(){

    abrirMenu();

}


/* =====================================================
   BIPAR
===================================================== */

function bipar(){

    const campo =
        document.getElementById("codigo");

    const codigo =
        campo.value.trim();

    if(!codigo){

        campo.focus();

        return;

    }

    let produto =
        banco[codigo];

    if(!produto){

        produto = {

            nome:"Produto "+codigo,

            preco:10

        };

    }

    const existente =
        carrinho.find(
            p => p.codigo === codigo
        );

    if(existente){

        existente.quantidade++;

    }else{

        carrinho.push({

            codigo:codigo,

            nome:produto.nome,

            preco:produto.preco,

            quantidade:1

        });

    }

    campo.value="";

    atualizar();

    campo.focus();

}


/* ENTER DO LEITOR */

document
.getElementById("codigo")
.addEventListener(
    "keydown",
    function(e){

        if(e.key==="Enter"){

            bipar();

        }

    }
);


/* =====================================================
   ATUALIZAR PRODUTOS
===================================================== */

function atualizar(){

    const lista =
        document.getElementById("produtosVenda");

    lista.innerHTML="";

    if(carrinho.length===0){

        lista.innerHTML=`
            <div style="
            text-align:center;
            padding:80px 20px;
            color:#888;">
            Passe os produtos no leitor.
            </div>
        `;

        document
        .getElementById("valorTotal")
        .innerText="R$ 0,00";

        return;

    }

    let total=0;

    carrinho.forEach(
        (produto,index)=>{

        const subtotal =
            produto.preco *
            produto.quantidade;

        total += subtotal;

        lista.innerHTML += `

            <div class="produto">

                <div>
                    <strong>
                        ${produto.nome}
                    </strong>

                    <small style="
                    display:block;
                    color:#999;">
                        ${produto.codigo}
                    </small>
                </div>

                <div>
                    ${produto.quantidade}x
                </div>

                <div>
                    R$ ${subtotal
                    .toFixed(2)
                    .replace(".",",")}
                </div>

                <button
                    onclick="remover(${index})">
                    ×
                </button>

            </div>
        `;

    });


    document
    .getElementById("valorTotal")
    .innerText =
        "R$ " +
        total
        .toFixed(2)
        .replace(".",",");

}


/* =====================================================
   REMOVER
===================================================== */

function remover(index){

    if(carrinho[index].quantidade>1){

        carrinho[index].quantidade--;

    }else{

        carrinho.splice(index,1);

    }

    atualizar();

}


/* =====================================================
   PAGAMENTO
===================================================== */

function pagamento(botao,forma){

    document
    .querySelectorAll(".pagamento button")
    .forEach(b =>
        b.classList.remove("selecionado")
    );

    botao.classList.add("selecionado");

    formaPagamento=forma;

}


/* =====================================================
   FINALIZAR VENDA
===================================================== */

function finalizarVenda(){

    if(carrinho.length===0){

        alert("Nenhum produto foi adicionado.");

        return;

    }

    if(!formaPagamento){

        alert("Escolha a forma de pagamento.");

        return;

    }

    let total=0;

    carrinho.forEach(p=>{

        total +=
            p.preco*p.quantidade;

    });

    vendas.push({

        numero:vendas.length+1,

        horario:new Date(),

        produtos:[...carrinho],

        pagamento:formaPagamento,

        total:total

    });

    alert(
        "Venda finalizada com sucesso!"
    );

    carrinho=[];

    formaPagamento="";

    document
    .querySelectorAll(".pagamento button")
    .forEach(b =>
        b.classList.remove("selecionado")
    );

    atualizar();

}


/* =====================================================
   VENDAS DO DIA
===================================================== */

function abrirVendasDoDia(){

    document
    .getElementById("menu")
    .classList.remove("aberto");

    const lista =
        document.getElementById("listaVendas");

    lista.innerHTML="";

    if(vendas.length===0){

        lista.innerHTML=`
            <div style="
            text-align:center;
            padding:40px;
            color:#888;">
            Nenhuma venda realizada hoje.
            </div>
        `;

    }else{

        [...vendas]
        .reverse()
        .forEach(venda=>{

            const hora =
                venda.horario
                .toLocaleTimeString(
                    "pt-BR",
                    {
                        hour:"2-digit",
                        minute:"2-digit"
                    }
                );

            let produtos="";

            venda.produtos.forEach(p=>{

                produtos +=
                    `${p.quantidade}x ${p.nome}<br>`;

            });

            lista.innerHTML += `

                <div class="vendaDia">

                    <strong>
                        Venda #${venda.numero}
                    </strong>

                    <span>
                        — ${hora}
                    </span>

                    <div style="margin-top:10px;">
                        ${produtos}
                    </div>

                    <div style="margin-top:8px;">
                        Pagamento:
                        <strong>
                            ${venda.pagamento}
                        </strong>
                    </div>

                    <div style="
                    margin-top:8px;
                    font-size:20px;
                    font-weight:bold;">

                        R$
                        ${venda.total
                        .toFixed(2)
                        .replace(".",",")}

                    </div>

                </div>
            `;

        });

    }

    document
    .getElementById("modalVendas")
    .style.display="flex";

}


/* =====================================================
   FECHAR VENDAS
===================================================== */

function fecharVendas(){

    document
    .getElementById("modalVendas")
    .style.display="none";

}


/* =====================================================
   MENSAGEM
===================================================== */

function mensagem(nome){

    document
    .getElementById("menu")
    .classList.remove("aberto");

    alert(nome+" em breve.");

}

</script>

</body>
</html>
