<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>DAV - Caixa Livre</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #ffffff;
            overflow: hidden;
        }

        /* TELA PRINCIPAL */
        .tela {
            width: 100vw;
            height: 100vh;

            position: relative;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #ffffff;

            overflow: hidden;
        }

        /* =========================
           DAV - MARCA D'ÁGUA
        ========================= */

        .dav-fundo {
            position: absolute;

            left: 50%;
            top: 50%;

            transform: translate(-50%, -50%);

            font-size: clamp(260px, 48vw, 700px);

            font-weight: 900;

            color: #ff6600;

            opacity: 0.035;

            letter-spacing: 20px;

            white-space: nowrap;

            user-select: none;

            pointer-events: none;

            z-index: 1;
        }

        /* =========================
           CONTEÚDO
        ========================= */

        .conteudo {
            position: relative;

            z-index: 2;

            text-align: center;

            display: flex;

            flex-direction: column;

            align-items: center;
        }

        /* CAIXA LIVRE */

        .caixa-livre {
            color: #ff6600;

            font-size: clamp(58px, 10vw, 150px);

            font-weight: 900;

            letter-spacing: 5px;

            line-height: 1;

            text-shadow:
                0 3px 10px rgba(255, 102, 0, 0.10);
        }

        /* SUPERMERCADO */

        .supermercado {
            margin-top: 20px;

            color: #0756a6;

            font-size: clamp(22px, 3vw, 42px);

            font-weight: 800;

            letter-spacing: 1px;
        }

        /* HORÁRIO */

        .horario {
            margin-top: 12px;

            color: #555555;

            font-size: clamp(20px, 2.8vw, 32px);

            font-weight: 600;

            letter-spacing: 2px;
        }

        /* LINHA */

        .linha {
            width: 130px;

            height: 5px;

            margin-top: 22px;

            background: #ff6600;

            border-radius: 20px;
        }

        /* =========================
           GT DELIVERY
        ========================= */

        .gt-delivery {
            position: absolute;

            right: 25px;
            bottom: 20px;

            color: #ff6600;

            font-size: 14px;

            font-weight: 800;

            letter-spacing: 1px;

            opacity: 0.65;

            z-index: 5;
        }

        /* =========================
           RESPONSIVO
        ========================= */

        @media (max-width: 700px) {

            .caixa-livre {
                font-size: 48px;
                letter-spacing: 2px;
            }

            .supermercado {
                font-size: 21px;
                margin-top: 15px;
            }

            .horario {
                font-size: 18px;
                margin-top: 10px;
            }

            .dav-fundo {
                font-size: 220px;
                opacity: 0.035;
            }

            .linha {
                width: 100px;
                height: 4px;
            }

            .gt-delivery {
                right: 15px;
                bottom: 15px;
                font-size: 11px;
            }
        }
    </style>
</head>

<body>

    <main class="tela">

        <!-- DAV COMO MARCA D'ÁGUA -->
        <div class="dav-fundo">
            DAV
        </div>

        <!-- CONTEÚDO CENTRAL -->
        <div class="conteudo">

            <div class="caixa-livre">
                CAIXA LIVRE
            </div>

            <div class="supermercado">
                Supermercado Val Bença
            </div>

            <div
                class="horario"
                id="horario"
            >
                00:00:00
            </div>

            <div class="linha"></div>

        </div>

        <!-- GT DELIVERY -->
        <div class="gt-delivery">
            GT Delivery
        </div>

    </main>

    <script>
        function atualizarHorario() {

            const agora = new Date();

            const horas = String(
                agora.getHours()
            ).padStart(2, "0");

            const minutos = String(
                agora.getMinutes()
            ).padStart(2, "0");

            const segundos = String(
                agora.getSeconds()
            ).padStart(2, "0");

            document.getElementById("horario").textContent =
                horas + ":" +
                minutos + ":" +
                segundos;
        }

        atualizarHorario();

        setInterval(
            atualizarHorario,
            1000
        );
    </script>

</body>
</html>
