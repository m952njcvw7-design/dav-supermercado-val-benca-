<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>DAV - Supermercado Val Bença</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

html,
body{
    width:100%;
    height:100%;
    background:#eef0f3;
    overflow:hidden;
}

/* =====================================================
   DAV
===================================================== */

#dav{
    width:100vw;
    height:100vh;
    min-width:1050px;
    min-height:650px;
    display:flex;
    flex-direction:column;
    background:#eef0f3;
}


/* =====================================================
   CABEÇALHO
===================================================== */

.cabecalho{

    height:115px;

    background:#285ca8;

    display:flex;

    align-items:center;

    justify-content:space-between;

    padding:0 35px;

    box-shadow:
        0 3px 10px rgba(0,0,0,.18);

    flex-shrink:0;
}


/* LOGO VB */

.logo{

    width:92px;
    height:92px;

    border-radius:50%;

    background:#ffdc45;

    color:#285ca8;

    display:flex;

    align-items:center;

    justify-content:center;

    font-size:40px;

    font-weight:900;

}


/* NOME */

.nome-supermercado{

    margin-left:22px;

    color:white;

    flex:1;
}

.nome-supermercado h1{

    font-size:28px;

    margin-bottom:5px;

}

.nome-supermercado span{

    font-size:15px;

    opacity:.9;

}


/* =====================================================
   TRÊS PONTINHOS
===================================================== */

.menu-area{

    position:relative;
}

.botao-menu{

    width:58px;
    height:58px;

    border:0;

    background:transparent;

    color:white;

    font-size:40px;

    line-height:40px;

    cursor:pointer;

}

.botao-menu:hover{

    background:rgba(255,255,255,.12);

    border-radius:50%;

}


/* =====================================================
   MENU
===================================================== */

.menu{

    display:none;

    position:absolute;

    right:0;

    top:65px;

    width:250px;

    background:white;

    border-radius:12px;

    overflow:hidden;

    box-shadow:
        0 8px 25px rgba(0,0,0,.25);

    z-index:100;
}

.menu.aberto{

    display:block;

}

.menu button{

    width:100%;

    border:0;

    background:white;

    padding:17px;

    text-align:left;

    font-size:15px;

    cursor:pointer;

}

.menu button:hover{

    background:#f1f1f1;

}


/* =====================================================
   ÁREA PRINCIPAL
===================================================== */

.principal{

    flex:1;

    display:flex;

    flex-direction:column;

    padding:22px 28px 18px;

    min-height:0;

}


/* =====================================================
   TÍTULO
===================================================== */

.titulo{

    display:flex;

    align-items:center;

    justify-content:space-between;

    margin-bottom:15px;

}

.titulo h2{

    color:#285ca8;

    font-size:28px;

}

.titulo span{

    color:#777;

    font-size:14px;

}


/* =====================================================
   LEITOR
===================================================== */

.leitor{

    width:100%;

    background:white;

    border-radius:12px;

    padding:15px;

    box-shadow:
        0 2px 8px rgba(0,0,0,.10);

    display:flex;

    align-items:center;

    gap:12px;

    margin-bottom:15px;

    flex-shrink:0;

}

.leitor label{

    color:#285ca8;

    font-weight:bold;

    white-space:nowrap;

}

.leitor input{

    height:46px;

    flex:1;

    border:2px solid #ffda3d;

    border-radius:8px;

    outline:none;

    padding:0 15px;

    font-size:16px;

}

.leitor input:focus{

    border-color:#285ca8;

}

.botao-bipar{

    height:46px;

    padding:0 25px;

    border:0;

    border-radius:8px;

    background:#ffda3d;

    color:#285ca8;

    font-size:15px;

    font-weight:bold;

    cursor:pointer;

}


/* =====================================================
   ÁREA DA VENDA
===================================================== */

.area-venda{

    flex:1;

    min-height:0;

    display:grid;

    grid-template-columns:minmax(0,1fr) 340px;

    gap:18px;

}


/* =====================================================
   LISTA
===================================================== */

.caixa-produtos{

    background:white;

    border-radius:12px;

    overflow:hidden;

    box-shadow:
        0 2px 8px rgba(0,0,0,.10);

    display:flex;

    flex-direction:column;

    min-width:0;

}

.cabecalho-produtos{

    height:55px;

    display:grid;

    grid-template-columns:
        minmax(0,1fr)
        90px
        130px
        40px;

    align-items:center;

    padding:0 18px;

    background:#285ca8;

    color:white;

    font-weight:bold;

}

.lista{

    flex:1;

    overflow-y:auto;

}


/* =====================================================
   PRODUTO
===================================================== */

.produto{

    min-height:65px;

    display:grid;

    grid-template-columns:
        minmax(0,1fr)
        90px
        130px
        40px;

    align-items:center;

    padding:0 18px;

    border-bottom:1px solid #e6e6e6;

}

.produto-nome{

    font-weight:bold;

    color:#333;

}

.produto-codigo{

    display:block;

    color:#999;

    font-size:11px;

    margin-top:3px;

}

.produto-qtd{

    text-align:center;

    font-weight:bold;

}

.produto-preco{

    text-align:right;

    font-weight:bold;

    color:#285ca8;

}

.excluir{

    width:30px;

    height:30px;

    border:0;

    border-radius:6px;

    background:#eee;

    cursor:pointer;

}


/* =====================================================
   MENSAGEM VAZIA
===================================================== */

.vazio{

    height:100%;

    min-height:250px;

    display:flex;

    align-items:center;

    justify-content:center;

    flex-direction:column;

    color:#999;

    text-align:center;

}

.vazio-icone{

    font-size:48px;

    margin-bottom:10px;

}

.vazio strong{

    color:#666;

    font-size:17px;

}


/* =====================================================
   RESUMO
===================================================== */

.resumo{

    background:white;

    border-radius:12px;

    overflow:hidden;

    box-shadow:
        0 2px 8px rgba(0,0,0,.10);

    display:flex;

    flex-direction:column;

}


/* TOTAL */

.total{

    background:#285ca8;

    color:white;

    padding:22px;

}

.total small{

    display:block;

    font-size:14px;

    margin-bottom:7px;

}

.total strong{

    display:block;

    font-size:39px;

}


/* PAGAMENTO */

.pagamento{

    padding:17px;

}

.pagamento h3{

    color:#285ca8;

    font-size:18px;

    margin-bottom:12px;

}

.pagamentos{

    display:grid;

    grid-template-columns:1fr 1fr;

    gap:8px;

}

.pagamentos button{

    height:45px;

    border:2px solid #ddd;

    background:white;

    border-radius:8px;

    color:#285ca8;

    font-weight:bold;

    cursor:pointer;

}

.pagamentos button.selecionado{

    background:#ffda3d;

    border-color:#ffda3d;

}


/* FINALIZAR */

.finalizar{

    margin:auto 17px 17px;

    height:52px;

    border:0;

    border-radius:9px;

    background:#285ca8;

    color:white;

    font-size:16px;

    font-weight:bold;

    cursor:pointer;

}

.finalizar:hover{

    background:#1f4d91;

}


/* =====================================================
   RODAPÉ
===================================================== */

.rodape{

    height:42px;

    background:#111;

    color:white;

    display:flex;

    align-items:center;

    justify-content:space-between;

    padding:0 25px;

    font-size:12px;

    flex-shrink:0;

}

.rodape strong{

    color:#ffda3d;

}


/* =====================================================
   MODAL VENDAS DO DIA
===================================================== */

.modal{

    display:none;

    position:fixed;

    inset:0;

    background:rgba(0,0,0,.65);

    z-index:500;

    align-items:center;

    justify-content:center;

    padding:30px;

}

.modal.aberto{

    display:flex;

}

.janela{

    width:min(750px,100%);

    max-height:85vh;

    background:white;

    border-radius:14px;

    overflow:hidden;

}

.janela-topo{

    height:60px;

    background:#285ca8;

    color:white;

    padding:0 20px;

    display:flex;

    align-items:center;

    justify-content:space-between;

}

.janela-topo button{

    border:0;

    background:transparent;

    color:white;

    font-size:28px;

    cursor:pointer;

}

.vendas-lista{

    padding:20px;

    max-height:70vh;

    overflow-y:auto;

}

.venda{

    border:1px solid #ddd;

    border-radius:9px;

    padding:14px;

    margin-bottom:10px;

}

.venda strong{

    color:#285ca8;

}


/* =====================================================
   RESPONSIVO
   MANTÉM O FORMATO DO DAV
===================================================== */

@media(max-width:700px){

    #dav{

        min-width:900px;

    }

    .cabecalho{

        height:100px;

        padding:0 25px;

    }

    .logo{

        width:76px;
        height:76px;

        font-size:32px;

    }

    .nome-supermercado h1{

        font-size:23px;

    }

    .principal{

        padding:18px 22px;

    }

}


/* =====================================================
   ESCONDER BARRA LATERAL / NUNCA USAR
===================================================== */

.sidebar{

    display:none !important;

}

</style>
</head>
