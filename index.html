<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Caixa Livre - Supermercado Val Bença</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}

body{
    background:#f3f3f3;
    color:#222;
    height:100vh;
    overflow:hidden
}

.topo{
    height:76px;
    background:#171717;
    color:white;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 25px
}

.topo h1{
    font-size:29px;
    letter-spacing:1px
}

.topo small{
    color:#aaa;
    font-size:13px
}

.gt{
    display:flex;
    align-items:center;
    gap:6px;
    color:#ff7900;
    font-size:10px;
    font-weight:bold
}

.gt-logo{
    width:28px;
    height:28px;
    background:#ff7900;
    border-radius:7px;
    display:flex;
    align-items:center;
    justify-content:center;
    color:white
}

.principal{
    height:calc(100vh - 76px);
    padding:18px 25px;
    display:flex;
    flex-direction:column
}

.busca{
    display:flex;
    gap:10px;
    margin-bottom:14px
}

.busca input{
    flex:1;
    height:58px;
    border:2px solid #ddd;
    border-radius:9px;
    padding:0 18px;
    font-size:19px;
    outline:none;
    background:white
}

.busca input:focus{
    border-color:#ff7900
}

.btn{
    border:0;
    border-radius:8px;
    padding:13px 20px;
    font-weight:bold;
    cursor:pointer
}

.laranja{
    background:#ff7900;
    color:white
}

.tabela{
    flex:1;
    background:white;
    border:1px solid #ddd;
    border-radius:10px;
    overflow:auto
}

table{
    width:100%;
    border-collapse:collapse
}

thead{
    background:#222;
    color:white;
    position:sticky;
    top:0
}

th,td{
    padding:14px;
    text-align:left;
    border-bottom:1px solid #eee
}

.vazio{
    text-align:center;
    color:#999;
    padding:70px
}

.rodape{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:20px;
    margin-top:14px
}

.total-box{
    text-align:right
}

.total-box small{
    color:#777
}

.total{
    font-size:38px;
    font-weight:bold
}

.acoes{
    display:flex;
    gap:10px
}

.cancelar{
    background:#ddd
}

.finalizar{
    background:#ff7900;
    color:white;
    min-width:190px
}

/* MENU */
.menu-btn{
    position:fixed;
    left:18px;
    bottom:18px;
    width:46px;
    height:46px;
    border:0;
    border-radius:50%;
    background:#222;
    color:white;
    font-size:21px;
    cursor:pointer;
    z-index:30
}

.menu{
    position:fixed;
    left:18px;
    bottom:75px;
    width:270px;
    background:white;
    border-radius:12px;
    box-shadow:0 5px 30px #0004;
    padding:10px;
    display:none;
    z-index:30
}

.menu.aberto{
    display:block
}

.menu h3{
    padding:12px;
    border-bottom:1px solid #eee
}

.menu button{
    width:100%;
    padding:14px;
    border:0;
    background:white;
    text-align:left;
    border-radius:7px;
    cursor:pointer
}

.menu button:hover{
    background:#f2f2f2
}

/* CADASTRO */
.modal{
    position:fixed;
    inset:0;
    background:#0008;
    display:none;
    align-items:center;
    justify-content:center;
    z-index:50
}

.modal.aberto{
    display:flex
}

.caixa{
    background:white;
    width:450px;
    max-width:92%;
    padding:25px;
    border-radius:14px
}

.caixa h2{
    margin-bottom:18px
}

.caixa input{
    width:100%;
    padding:13px;
    margin-bottom:10px;
    border:1px solid #ccc;
    border-radius:7px;
    font-size:16px
}

.botoes-modal{
    display:flex;
    gap:10px;
    margin-top:10px
}

.botoes-modal button{
    flex:1
}

.status{
    font-size:13px;
    margin-top:10px;
    min-height:18px
}

/* PAGAMENTO */
.formas{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px
}

.formas button{
    padding:18px;
    border:1px solid #ddd;
    background:#fafafa;
    border-radius:8px;
    cursor:pointer;
    font-weight:bold
}

.formas button:hover{
    background:#ff7900;
    color:white
}

@media(max-width:700px){
    body{overflow:auto}

    .topo{
        height:65px;
        padding:0 12px
    }

    .topo h1{font-size:21px}
    .topo small{display:none}

    .principal{
        height:auto;
        min-height:calc(100vh - 65px);
        padding:12px
    }

    .busca{
        flex-direction:column
    }

    .busca button{
        height:52px
    }

    .rodape{
        flex-direction:column;
        align-items:stretch
    }

    .total-box{text-align:center}

    .acoes{
        display:grid;
        grid-template-columns:1fr 1fr
    }

    .finalizar{min-width:0}

    th,td{
        padding:9px;
        font-size:12px
    }
}
</style>
</head>

<body>

<header class="topo">

    <div>
        <h1>CAIXA LIVRE</h1>
        <small>Supermercado Val Bença</small>
    </div>

    <div class="gt">
        <div class="gt-logo">GT</div>
        GT DELIVERY
    </div>

</header>


<main class="principal">

    <div class="busca">

        <input
            id="codigo"
            type="text"
            inputmode="numeric"
            autocomplete="off"
            autofocus
            placeholder="Passe o código de barras no leitor..."
            onkeydown="codigoEnter(event)"
        >

        <button class="btn laranja" onclick="buscarProduto()">
            ADICIONAR
        </button>

    </div>


    <div class="tabela">

        <table>

            <thead>
                <tr>
                    <th>CÓDIGO</th>
                    <th>PRODUTO</th>
                    <th>QTD.</th>
                    <th>PREÇO</th>
                    <th>TOTAL</th>
                </tr>
            </thead>

            <tbody id="lista">

                <tr>
                    <td colspan="5" class="vazio">
                        Passe o primeiro produto no leitor de código de barras
                    </td>
                </tr>

            </tbody>

        </table>

    </div>


    <div class="rodape">

        <div>
            Itens: <strong id="itens">0</strong>
        </div>

        <div class="total-box">
            <small>TOTAL DA COMPRA</small>
            <div class="total">
                R$ <span id="total">0,00</span>
            </div>
        </div>

        <div class="acoes">

            <button class="btn cancelar" onclick="cancelarVenda()">
                CANCELAR
            </button>

            <button class="btn finalizar" onclick="abrirPagamento()">
                FINALIZAR VENDA
            </button>

        </div>

    </div>

</main>


<!-- MENU ESCONDIDO -->

<button class="menu-btn" onclick="abrirMenu()">☰</button>

<div id="menu" class="menu">

    <h3>Menu do Sistema</h3>

    <button onclick="abrirCadastro()">
        📦 Cadastro de Produtos
    </button>

    <button onclick="mostrarProdutos()">
        📋 Produtos Cadastrados
    </button>

    <button onclick="alert('Estoque será conectado na próxima etapa.')">
        📊 Estoque
    </button>

    <button onclick="alert('Relatórios serão conectados na próxima etapa.')">
        📈 Relatórios
    </button>

    <button onclick="alert('Configurações serão conectadas na próxima etapa.')">
        ⚙️ Configurações
    </button>

</div>


<!-- CADASTRO -->

<div id="cadastroModal" class="modal">

    <div class="caixa">

        <h2>Cadastro de Produto</h2>

        <input
            id="cadCodigo"
            placeholder="Código de barras"
        >

        <input
            id="cadNome"
            placeholder="Nome do produto"
        >

        <input
            id="cadPreco"
            type="number"
            step="0.01"
            placeholder="Preço de venda"
        >

        <input
            id="cadEstoque"
            type="number"
            step="0.001"
            placeholder="Estoque inicial"
        >

        <div class="botoes-modal">

            <button
                class="btn cancelar"
                onclick="fecharCadastro()">
                CANCELAR
            </button>

            <button
                class="btn laranja"
                onclick="salvarProduto()">
                SALVAR PRODUTO
            </button>

        </div>

        <div id="statusCadastro" class="status"></div>

    </div>

</div>


<!-- PAGAMENTO -->

<div id="pagamentoModal" class="modal">

    <div class="caixa">

        <h2>Finalizar Venda</h2>

        <div class="total">
            R$ <span id="valorPagamento">0,00</span>
        </div>

        <br>

        <div class="formas">

            <button onclick="finalizarVenda('Dinheiro')">
                💵 Dinheiro
            </button>

            <button onclick="finalizarVenda('Pix')">
                📱 Pix
            </button>

            <button onclick="finalizarVenda('Débito')">
                💳 Débito
            </button>

            <button onclick="finalizarVenda('Crédito')">
                💳 Crédito
            </button>

        </div>

        <br>

        <button
            class="btn cancelar"
            style="width:100%"
            onclick="fecharPagamento()">
            VOLTAR
        </button>

    </div>

</div>


<script>

/* ================================
   SUPABASE
================================ */

const SUPABASE_URL =
"https://cgdvehummqfttsyfebfo.supabase.co";

const SUPABASE_KEY =
"sb_publishable_rzYfEMq3RKJwlVPOmMQaUA_AAxWN9nr";

const supabaseClient =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* ================================
   VENDA ATUAL
================================ */

let venda = [];


/* ================================
   LEITOR
================================ */

function codigoEnter(event){

    if(event.key === "Enter"){

        event.preventDefault();

        buscarProduto();

    }

}


/* ================================
   BUSCAR PRODUTO PELO CÓDIGO
================================ */

async function buscarProduto(){

    const campo =
        document.getElementById("codigo");

    const codigo =
        campo.value.trim();

    if(!codigo){

        campo.focus();

        return;
    }


    const { data, error } =
        await supabaseClient
        .from("dav_produtos")
        .select("id,codigo_barras,nome,preco,estoque,ativo")
        .eq("codigo_barras", codigo)
        .eq("ativo", true)
        .maybeSingle();


    if(error){

        alert(
            "Erro ao consultar produto:\\n" +
            error.message
        );

        campo.focus();

        return;
    }


    if(!data){

        alert(
            "Produto não cadastrado.\\n\\n" +
            "Código: " + codigo
        );

        campo.value = "";

        campo.focus();

        return;
    }


    const existente =
        venda.find(
            item => item.id === data.id
        );


    if(existente){

        existente.quantidade++;

    }else{

        venda.push({

            id:data.id,

            codigo:data.codigo_barras,

            nome:data.nome,

            preco:Number(data.preco),

            quantidade:1,

            estoque:Number(data.estoque)

        });

    }


    campo.value = "";

    atualizarTela();

    campo.focus();

}


/* ================================
   ATUALIZAR CAIXA
================================ */

function atualizarTela(){

    const lista =
        document.getElementById("lista");

    lista.innerHTML = "";


    let total = 0;

    let quantidadeItens = 0;


    venda.forEach(produto => {

        const subtotal =
            produto.preco *
            produto.quantidade;

        total += subtotal;

        quantidadeItens +=
            produto.quantidade;


        lista.innerHTML += `

        <tr>

            <td>${produto.codigo}</td>

            <td>${produto.nome}</td>

            <td>${produto.quantidade}</td>

            <td>
                R$ ${dinheiro(produto.preco)}
            </td>

            <td>
                R$ ${dinheiro(subtotal)}
            </td>

        </tr>

        `;

    });


    if(venda.length === 0){

        lista.innerHTML = `

        <tr>

            <td colspan="5" class="vazio">
                Passe o primeiro produto no leitor de código de barras
            </td>

        </tr>

        `;

    }


    document.getElementById("total")
        .innerText = dinheiro(total);

    document.getElementById("itens")
        .innerText = quantidadeItens;

}


/* ================================
   DINHEIRO
================================ */

function dinheiro(valor){

    return Number(valor)
        .toFixed(2)
        .replace(".",",");

}


/* ================================
   CANCELAR
================================ */

function cancelarVenda(){

    if(venda.length === 0)
        return;


    if(confirm("Cancelar esta venda?")){

        venda = [];

        atualizarTela();

        document.getElementById("codigo")
            .focus();

    }

}


/* ================================
   PAGAMENTO
================================ */

function abrirPagamento(){

    if(venda.length === 0){

        alert(
            "Nenhum produto foi registrado."
        );

        document.getElementById("codigo")
            .focus();

        return;
    }


    const total =
        venda.reduce(
            (soma, produto) =>
                soma +
                produto.preco *
                produto.quantidade,
            0
        );


    document.getElementById(
        "valorPagamento"
    ).innerText = dinheiro(total);


    document.getElementById(
        "pagamentoModal"
    ).classList.add("aberto");

}


function fecharPagamento(){

    document.getElementById(
        "pagamentoModal"
    ).classList.remove("aberto");

}


/* ================================
   FINALIZAR VENDA
================================ */

async function finalizarVenda(forma){

    if(venda.length === 0)
        return;


    const total =
        venda.reduce(
            (soma, produto) =>
                soma +
                produto.preco *
                produto.quantidade,
            0
        );


    /*
       Atualiza o estoque dos produtos
       no Supabase.
    */

    for(const produto of venda){

        const novoEstoque =
            Math.max(
                0,
                produto.estoque -
                produto.quantidade
            );


        const { error } =
            await supabaseClient
            .from("dav_produtos")
            .update({
                estoque:novoEstoque,
                updated_at:new Date().toISOString()
            })
            .eq("id", produto.id);


        if(error){

            alert(
                "Não foi possível atualizar o estoque:\\n" +
                error.message
            );

            return;
        }

    }


    alert(
        "VENDA FINALIZADA!\\n\\n" +
        "Pagamento: " + forma +
        "\\nTotal: R$ " + dinheiro(total)
    );


    venda = [];

    atualizarTela();

    fecharPagamento();

    document.getElementById("codigo")
        .focus();

}


/* ================================
   MENU
================================ */

function abrirMenu(){

    document
        .getElementById("menu")
        .classList.toggle("aberto");

}


/* ================================
   CADASTRO
================================ */

function abrirCadastro(){

    document
        .getElementById("menu")
        .classList.remove("aberto");

    document
        .getElementById("cadastroModal")
        .classList.add("aberto");

    document
        .getElementById("cadCodigo")
        .focus();

}


function fecharCadastro(){

    document
        .getElementById("cadastroModal")
        .classList.remove("aberto");

    limparCadastro();

}


function limparCadastro(){

    document.getElementById("cadCodigo").value = "";

    document.getElementById("cadNome").value = "";

    document.getElementById("cadPreco").value = "";

    document.getElementById("cadEstoque").value = "";

    document.getElementById("statusCadastro").innerText = "";

}


/* ================================
   SALVAR PRODUTO NO SUPABASE
================================ */

async function salvarProduto(){

    const codigo =
        document.getElementById("cadCodigo")
        .value.trim();

    const nome =
        document.getElementById("cadNome")
        .value.trim();

    const preco =
        Number(
            document.getElementById("cadPreco")
            .value
        );

    const estoque =
        Number(
            document.getElementById("cadEstoque")
            .value || 0
        );


    if(!codigo || !nome || !preco){

        document.getElementById(
            "statusCadastro"
        ).innerText =
            "Preencha código, nome e preço.";

        return;
    }


    const { error } =
        await supabaseClient
        .from("dav_produtos")
        .upsert(
            {
                codigo_barras:codigo,
                nome:nome,
                preco:preco,
                estoque:estoque,
                ativo:true,
                updated_at:new Date().toISOString()
            },
            {
                onConflict:"codigo_barras"
            }
        );


    if(error){

        document.getElementById(
            "statusCadastro"
        ).innerText =
            "Erro: " + error.message;

        return;
    }


    document.getElementById(
        "statusCadastro"
    ).innerText =
        "✅ Produto salvo com sucesso!";


    document.getElementById("cadCodigo").value = "";

    document.getElementById("cadNome").value = "";

    document.getElementById("cadPreco").value = "";

    document.getElementById("cadEstoque").value = "";

}


/* ================================
   PRODUTOS CADASTRADOS
================================ */

async function mostrarProdutos(){

    document
        .getElementById("menu")
        .classList.remove("aberto");


    const { data, error } =
        await supabaseClient
        .from("dav_produtos")
        .select("codigo_barras,nome,preco,estoque")
        .order("nome");


    if(error){

        alert(
            "Erro ao carregar produtos:\\n" +
            error.message
        );

        return;
    }


    if(!data || data.length === 0){

        alert("Nenhum produto cadastrado.");

        return;
    }


    let texto =
        "PRODUTOS CADASTRADOS\\n\\n";


    data.forEach(produto => {

        texto +=
            produto.codigo_barras +
            " — " +
            produto.nome +
            " — R$ " +
            dinheiro(produto.preco) +
            " — Estoque: " +
            produto.estoque +
            "\\n";

    });


    alert(texto);

}


/* ================================
   INÍCIO
================================ */

atualizarTela();

document
    .getElementById("codigo")
    .focus();

</script>

</body>
</html>
