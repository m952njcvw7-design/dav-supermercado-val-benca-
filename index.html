<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DAV - Supermercado Val Bença</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Arial, Helvetica, sans-serif;
}

body {
    background: #f1f3f5;
    min-height: 100vh;
    color: #222;
}

/* =========================
   ESTRUTURA PRINCIPAL
========================= */

.app {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
}

/* =========================
   CABEÇALHO
========================= */

.header {
    height: 72px;
    background: #0756a8;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 22px;
    color: white;
    box-shadow: 0 2px 7px rgba(0,0,0,.18);
}

.logo-area {
    display: flex;
    align-items: center;
    gap: 12px;
}

.logo {
    width: 45px;
    height: 45px;
    border-radius: 50%;
    background: #ffd900;
    color: #0756a8;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 900;
    font-size: 20px;
}

.logo-text strong {
    display: block;
    font-size: 20px;
}

.logo-text small {
    font-size: 11px;
    opacity: .9;
}

.header-right {
    display: flex;
    align-items: center;
    gap: 18px;
}

.caixa {
    font-size: 13px;
}

.menu-btn {
    border: 0;
    background: transparent;
    color: white;
    font-size: 30px;
    cursor: pointer;
    width: 42px;
    height: 42px;
}

/* =========================
   ÁREA CENTRAL
========================= */

.main {
    flex: 1;
    display: flex;
    min-height: calc(100vh - 122px);
}

/* =========================
   MENU LATERAL
========================= */

.sidebar {
    width: 220px;
    background: #064d96;
    color: white;
    padding: 18px 12px;
}

.sidebar-title {
    font-size: 12px;
    opacity: .75;
    padding: 10px 12px;
    text-transform: uppercase;
}

.nav-button {
    width: 100%;
    border: 0;
    background: transparent;
    color: white;
    padding: 14px 13px;
    text-align: left;
    border-radius: 8px;
    margin-bottom: 5px;
    cursor: pointer;
    font-size: 14px;
}

.nav-button:hover,
.nav-button.active {
    background: rgba(255,255,255,.14);
}

.nav-button span {
    margin-right: 8px;
}

/* =========================
   CONTEÚDO DAV
========================= */

.content {
    flex: 1;
    padding: 22px;
    overflow: auto;
}

.page-title {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 18px;
}

.page-title h1 {
    font-size: 24px;
    color: #0756a8;
}

.page-title small {
    color: #777;
}

/* =========================
   LEITOR
========================= */

.scanner {
    background: white;
    border-radius: 12px;
    padding: 17px;
    margin-bottom: 18px;
    box-shadow: 0 2px 8px rgba(0,0,0,.08);
}

.scanner-label {
    font-size: 13px;
    font-weight: bold;
    margin-bottom: 8px;
    color: #0756a8;
}

.scanner-row {
    display: flex;
    gap: 10px;
}

#barcode {
    flex: 1;
    height: 48px;
    border: 2px solid #0756a8;
    border-radius: 8px;
    padding: 0 14px;
    font-size: 17px;
    outline: none;
}

#barcode:focus {
    border-color: #ffd900;
}

.scan-button {
    width: 125px;
    border: 0;
    border-radius: 8px;
    background: #ffd900;
    color: #0756a8;
    font-weight: bold;
    cursor: pointer;
    font-size: 14px;
}

.scan-button:hover {
    filter: brightness(.95);
}

/* =========================
   ÁREA DA VENDA
========================= */

.sale-layout {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 300px;
    gap: 18px;
}

.products-card,
.summary-card {
    background: white;
    border-radius: 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,.08);
}

.card-title {
    padding: 15px 18px;
    border-bottom: 1px solid #eee;
    color: #0756a8;
    font-weight: bold;
}

/* =========================
   PRODUTOS
========================= */

.products {
    min-height: 330px;
    max-height: 430px;
    overflow-y: auto;
}

.empty {
    min-height: 300px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #999;
    text-align: center;
    padding: 30px;
}

.product {
    display: grid;
    grid-template-columns: 1fr 75px 110px 35px;
    gap: 10px;
    align-items: center;
    padding: 13px 18px;
    border-bottom: 1px solid #eee;
}

.product-name {
    font-weight: bold;
}

.product-code {
    font-size: 11px;
    color: #999;
    margin-top: 3px;
}

.quantity {
    text-align: center;
}

.price {
    text-align: right;
    font-weight: bold;
}

.remove {
    border: 0;
    background: #eee;
    width: 30px;
    height: 30px;
    border-radius: 6px;
    cursor: pointer;
}

.remove:hover {
    background: #ddd;
}

/* =========================
   RESUMO
========================= */

.summary-card {
    padding-bottom: 16px;
}

.total-area {
    padding: 22px 18px;
    background: #0756a8;
    color: white;
}

.total-label {
    font-size: 13px;
    opacity: .9;
}

.total {
    font-size: 34px;
    font-weight: 900;
    margin-top: 5px;
}

.payment-title {
    padding: 17px 18px 10px;
    font-weight: bold;
    color: #0756a8;
}

.payment-buttons {
    padding: 0 15px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
}

.payment {
    height: 45px;
    border: 1px solid #ddd;
    background: white;
    border-radius: 7px;
    cursor: pointer;
    font-weight: bold;
}

.payment:hover,
.payment.selected {
    background: #ffd900;
    border-color: #ffd900;
    color: #0756a8;
}

.finish {
    width: calc(100% - 30px);
    margin: 16px 15px 0;
    height: 50px;
    border: 0;
    border-radius: 8px;
    background: #0756a8;
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

.finish:hover {
    background: #064782;
}

.new-sale {
    width: calc(100% - 30px);
    margin: 8px 15px 0;
    height: 42px;
    border: 1px solid #0756a8;
    border-radius: 8px;
    background: white;
    color: #0756a8;
    font-weight: bold;
    cursor: pointer;
}

/* =========================
   MENU DOS TRÊS PONTOS
========================= */

.menu-wrapper {
    position: relative;
}

.dropdown {
    display: none;
    position: absolute;
    right: 0;
    top: 52px;
    width: 245px;
    background: white;
    border-radius: 10px;
    box-shadow: 0 5px 20px rgba(0,0,0,.2);
    overflow: hidden;
    z-index: 1000;
}

.dropdown.open {
    display: block;
}

.dropdown button {
    width: 100%;
    border: 0;
    background: white;
    padding: 15px;
    text-align: left;
    cursor: pointer;
    font-size: 14px;
}

.dropdown button:hover {
    background: #f2f2f2;
}

/* =========================
   JANELA VENDAS DO DIA
========================= */

.modal-bg {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.55);
    z-index: 2000;
    align-items: center;
    justify-content: center;
    padding: 20px;
}

.modal-bg.open {
    display: flex;
}

.modal {
    background: white;
    width: min(700px, 100%);
    max-height: 85vh;
    border-radius: 14px;
    overflow: hidden;
}

.modal-header {
    background: #0756a8;
    color: white;
    padding: 17px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.close-modal {
    border: 0;
    background: transparent;
    color: white;
    font-size: 25px;
    cursor: pointer;
}

.sales-list {
    max-height: 65vh;
    overflow-y: auto;
    padding: 15px;
}

.sale-item {
    border: 1px solid #ddd;
    border-radius: 9px;
    padding: 13px;
    margin-bottom: 9px;
}

.sale-item strong {
    color: #0756a8;
}

.sale-total {
    font-size: 18px;
    font-weight: bold;
    margin-top: 5px;
}

.no-sales {
    padding: 40px;
    text-align: center;
    color: #888;
}

/* =========================
   RODAPÉ
========================= */

.footer {
    height: 50px;
    background: #111;
    color: white;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 20px;
    font-size: 12px;
}

.footer strong {
    color: #ffd900;
}

/* =========================
   RESPONSIVO
========================= */

@media(max-width: 850px) {

    .sidebar {
        display: none;
    }

    .sale-layout {
        grid-template-columns: 1fr;
    }

    .summary-card {
        order: -1;
    }

    .product {
        grid-template-columns: 1fr 55px 90px 35px;
        font-size: 13px;
    }

    .header {
        padding: 0 12px;
    }

    .content {
        padding: 12px;
    }
}

@media(max-width: 520px) {

    .logo-text {
        display: none;
    }

    .caixa {
        display: none;
    }

    .scanner-row {
        flex-direction: column;
    }

    .scan-button {
        width: 100%;
        height: 45px;
    }

    .product {
        grid-template-columns: 1fr 45px 75px 30px;
        gap: 5px;
        padding: 12px 10px;
    }

    .price {
        font-size: 12px;
    }
}
</style>
</head>

<body>

<div class="app">

    <!-- CABEÇALHO -->
    <header class="header">

        <div class="logo-area">
            <div class="logo">VB</div>

            <div class="logo-text">
                <strong>Supermercado Val Bença</strong>
                <small>DAV • Frente de Caixa</small>
            </div>
        </div>

        <div class="header-right">

            <div class="caixa">
                Caixa 01
            </div>

            <!-- TRÊS PONTINHOS -->
            <div class="menu-wrapper">

                <button
                    class="menu-btn"
                    onclick="toggleMenu()">
                    ⋮
                </button>

                <div
                    class="dropdown"
                    id="dropdownMenu">

                    <button onclick="openSales()">
                        📋 Vendas do dia
                    </button>

                    <button onclick="showMessage('Consulta de produtos')">
                        🔎 Consulta de produtos
                    </button>

                    <button onclick="showMessage('Configurações')">
                        ⚙️ Configurações
                    </button>

                </div>
            </div>

        </div>
    </header>


    <main class="main">

        <!-- MENU LATERAL -->
        <aside class="sidebar">

            <div class="sidebar-title">
                Menu
            </div>

            <button class="nav-button active">
                🛒 Nova venda
            </button>

            <button class="nav-button">
                📦 Produtos
            </button>

            <button class="nav-button">
                👥 Clientes
            </button>

            <button class="nav-button">
                💳 Caixa
            </button>

        </aside>


        <!-- CONTEÚDO -->
        <section class="content">

            <div class="page-title">

                <div>
                    <h1>Nova venda</h1>
                    <small>Passe os produtos no leitor</small>
                </div>

            </div>


            <!-- LEITOR -->
            <div class="scanner">

                <div class="scanner-label">
                    Código de barras
                </div>

                <div class="scanner-row">

                    <input
                        id="barcode"
                        type="text"
                        placeholder="Aponte o leitor ou digite o código..."
                        autocomplete="off">

                    <button
                        class="scan-button"
                        onclick="scanProduct()">
                        BIPAR PRODUTO
                    </button>

                </div>

            </div>


            <!-- VENDA -->
            <div class="sale-layout">

                <!-- LISTA DE PRODUTOS -->
                <div class="products-card">

                    <div class="card-title">
                        Produtos da venda
                    </div>

                    <div
                        class="products"
                        id="products">

                        <div class="empty" id="empty">
                            <div>
                                <div style="font-size:40px;margin-bottom:10px;">
                                    🛒
                                </div>

                                <strong>Nenhum produto na venda</strong>

                                <br>

                                <small>
                                    Passe o primeiro produto no leitor.
                                </small>
                            </div>
                        </div>

                    </div>

                </div>


                <!-- RESUMO -->
                <div class="summary-card">

                    <div class="total-area">

                        <div class="total-label">
                            TOTAL DA VENDA
                        </div>

                        <div
                            class="total"
                            id="total">
                            R$ 0,00
                        </div>

                    </div>


                    <div class="payment-title">
                        Forma de pagamento
                    </div>

                    <div class="payment-buttons">

                        <button
                            class="payment"
                            onclick="selectPayment(this,'Dinheiro')">
                            💵 Dinheiro
                        </button>

                        <button
                            class="payment"
                            onclick="selectPayment(this,'Pix')">
                            📱 Pix
                        </button>

                        <button
                            class="payment"
                            onclick="selectPayment(this,'Débito')">
                            💳 Débito
                        </button>

                        <button
                            class="payment"
                            onclick="selectPayment(this,'Crédito')">
                            💳 Crédito
                        </button>

                    </div>


                    <button
                        class="finish"
                        onclick="finishSale()">
                        FINALIZAR VENDA
                    </button>

                    <button
                        class="new-sale"
                        onclick="newSale()">
                        NOVA VENDA
                    </button>

                </div>

            </div>

        </section>

    </main>


    <!-- RODAPÉ -->
    <footer class="footer">

        <span>
            Supermercado Val Bença
        </span>

        <span>
            <strong>GT Delivery</strong>
        </span>

    </footer>

</div>


<!-- =========================
     MODAL VENDAS DO DIA
========================= -->

<div
    class="modal-bg"
    id="salesModal">

    <div class="modal">

        <div class="modal-header">

            <strong>
                Vendas do dia
            </strong>

            <button
                class="close-modal"
                onclick="closeSales()">
                ×
            </button>

        </div>

        <div
            class="sales-list"
            id="salesList">
        </div>

    </div>

</div>


<script>

/* =========================
   BANCO DE PRODUTOS DEMO
========================= */

const productsDB = {

    "7891000100103": {
        name: "Arroz Branco 5kg",
        price: 27.90
    },

    "7891000100202": {
        name: "Feijão Carioca 1kg",
        price: 8.49
    },

    "7891000100301": {
        name: "Açúcar Cristal 1kg",
        price: 4.99
    },

    "7891000100400": {
        name: "Café 500g",
        price: 16.90
    },

    "7891000100509": {
        name: "Leite Integral 1L",
        price: 5.49
    }

};


/* =========================
   CARRINHO
========================= */

let cart = [];

let selectedPayment = null;


/* =========================
   VENDAS DO DIA
========================= */

let salesToday = [];


/* =========================
   BIPAR
========================= */

function scanProduct() {

    const input = document.getElementById("barcode");

    const code = input.value.trim();

    if (!code) {
        input.focus();
        return;
    }

    let product = productsDB[code];

    if (!product) {

        product = {
            name: "Produto " + code,
            price: 10.00
        };

    }

    const existing = cart.find(
        item => item.code === code
    );

    if (existing) {

        existing.quantity++;

    } else {

        cart.push({
            code: code,
            name: product.name,
            price: product.price,
            quantity: 1
        });

    }

    input.value = "";

    renderCart();

    input.focus();
}


/* =========================
   ENTER NO LEITOR
========================= */

document
    .getElementById("barcode")
    .addEventListener("keydown", function(event) {

        if (event.key === "Enter") {
            scanProduct();
        }

    });


/* =========================
   MOSTRAR PRODUTOS
========================= */

function renderCart() {

    const container =
        document.getElementById("products");

    container.innerHTML = "";

    if (cart.length === 0) {

        container.innerHTML = `
            <div class="empty">
                <div>
                    <div style="font-size:40px;margin-bottom:10px;">
                        🛒
                    </div>

                    <strong>Nenhum produto na venda</strong>

                    <br>

                    <small>
                        Passe o primeiro produto no leitor.
                    </small>
                </div>
            </div>
        `;

        updateTotal();

        return;
    }


    cart.forEach((item, index) => {

        const subtotal =
            item.price * item.quantity;

        const div =
            document.createElement("div");

        div.className = "product";

        div.innerHTML = `

            <div>
                <div class="product-name">
                    ${item.name}
                </div>

                <div class="product-code">
                    ${item.code}
                </div>
            </div>

            <div class="quantity">
                ${item.quantity}x
            </div>

            <div class="price">
                ${money(subtotal)}
            </div>

            <button
                class="remove"
                onclick="removeProduct(${index})">
                ×
            </button>
        `;

        container.appendChild(div);

    });


    updateTotal();
}


/* =========================
   REMOVER PRODUTO
========================= */

function removeProduct(index) {

    if (cart[index].quantity > 1) {

        cart[index].quantity--;

    } else {

        cart.splice(index, 1);

    }

    renderCart();
}


/* =========================
   TOTAL
========================= */

function updateTotal() {

    let total = 0;

    cart.forEach(item => {

        total +=
            item.price * item.quantity;

    });

    document.getElementById("total")
        .textContent = money(total);
}


/* =========================
   PAGAMENTO
========================= */

function selectPayment(button, payment) {

    document
        .querySelectorAll(".payment")
        .forEach(btn => {

            btn.classList.remove("selected");

        });

    button.classList.add("selected");

    selectedPayment = payment;
}


/* =========================
   FINALIZAR VENDA
========================= */

function finishSale() {

    if (cart.length === 0) {

        alert("Passe pelo menos um produto.");

        return;
    }

    if (!selectedPayment) {

        alert("Escolha a forma de pagamento.");

        return;
    }


    let total = cart.reduce(
        (sum, item) =>
            sum + item.price * item.quantity,
        0
    );


    const sale = {

        number: salesToday.length + 1,

        date: new Date(),

        items: [...cart],

        payment: selectedPayment,

        total: total

    };


    salesToday.push(sale);


    alert(
        "Venda finalizada com sucesso!\n\n" +
        "Total: " + money(total) +
        "\nPagamento: " + selectedPayment
    );


    newSale();
}


/* =========================
   NOVA VENDA
========================= */

function newSale() {

    cart = [];

    selectedPayment = null;

    document
        .querySelectorAll(".payment")
        .forEach(btn => {

            btn.classList.remove("selected");

        });

    renderCart();

    document
        .getElementById("barcode")
        .focus();
}


/* =========================
   MENU TRÊS PONTINHOS
========================= */

function toggleMenu() {

    document
        .getElementById("dropdownMenu")
        .classList.toggle("open");
}


/* =========================
   VENDAS DO DIA
========================= */

function openSales() {

    document
        .getElementById("dropdownMenu")
        .classList.remove("open");

    renderSales();

    document
        .getElementById("salesModal")
        .classList.add("open");
}


function closeSales() {

    document
        .getElementById("salesModal")
        .classList.remove("open");
}


function renderSales() {

    const container =
        document.getElementById("salesList");

    container.innerHTML = "";


    if (salesToday.length === 0) {

        container.innerHTML = `
            <div class="no-sales">
                Nenhuma venda realizada hoje.
            </div>
        `;

        return;
    }


    [...salesToday]
        .reverse()
        .forEach(sale => {

            const div =
                document.createElement("div");

            div.className = "sale-item";


            const time =
                sale.date.toLocaleTimeString(
                    "pt-BR",
                    {
                        hour: "2-digit",
                        minute: "2-digit"
                    }
                );


            const productsText =
                sale.items
                    .map(item =>
                        `${item.quantity}x ${item.name}`
                    )
                    .join("<br>");


            div.innerHTML = `

                <strong>
                    Venda #${sale.number}
                </strong>

                <span>
                    — ${time}
                </span>

                <div style="margin-top:8px;font-size:13px;">
                    ${productsText}
                </div>

                <div style="margin-top:7px;font-size:13px;">
                    Pagamento: ${sale.payment}
                </div>

                <div class="sale-total">
                    ${money(sale.total)}
                </div>

            `;

            container.appendChild(div);

        });
}


/* =========================
   OUTROS BOTÕES
========================= */

function showMessage(text) {

    document
        .getElementById("dropdownMenu")
        .classList.remove("open");

    alert(text);
}


/* =========================
   FORMATAÇÃO DE DINHEIRO
========================= */

function money(value) {

    return value.toLocaleString(
        "pt-BR",
        {
            style: "currency",
            currency: "BRL"
        }
    );

}


/* =========================
   FECHAR MENU AO CLICAR FORA
========================= */

document.addEventListener("click", function(event) {

    const wrapper =
        document.querySelector(".menu-wrapper");

    if (!wrapper.contains(event.target)) {

        document
            .getElementById("dropdownMenu")
            .classList.remove("open");

    }

});


/* =========================
   INICIAR
========================= */

document
    .getElementById("barcode")
    .focus();

</script>

</body>
</html>
