<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>DAV - Supermercado Val Bença</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

html,
body{
    width:100%;
    height:100%;
    background:#eef0f3;
    overflow:hidden;
}

/* =====================================================
   DAV
===================================================== */

#dav{
    width:100vw;
    height:100vh;
    min-width:1050px;
    min-height:650px;
    display:flex;
    flex-direction:column;
    background:#eef0f3;
}


/* =====================================================
   CABEÇALHO
===================================================== */

.cabecalho{

    height:115px;

    background:#285ca8;

    display:flex;

    align-items:center;

    justify-content:space-between;

    padding:0 35px;

    box-shadow:
        0 3px 10px rgba(0,0,0,.18);

    flex-shrink:0;
}


/* LOGO VB */

.logo{

    width:92px;
    height:92px;

    border-radius:50%;

    background:#ffdc45;

    color:#285ca8;

    display:flex;

    align-items:center;

    justify-content:center;

    font-size:40px;

    font-weight:900;

}


/* NOME */

.nome-supermercado{

    margin-left:22px;

    color:white;

    flex:1;
}

.nome-supermercado h1{

    font-size:28px;

    margin-bottom:5px;

}

.nome-supermercado span{

    font-size:15px;

    opacity:.9;

}


/* =====================================================
   TRÊS PONTINHOS
===================================================== */

.menu-area{

    position:relative;
}

.botao-menu{

    width:58px;
    height:58px;

    border:0;

    background:transparent;

    color:white;

    font-size:40px;

    line-height:40px;

    cursor:pointer;

}

.botao-menu:hover{

    background:rgba(255,255,255,.12);

    border-radius:50%;

}


/* =====================================================
   MENU
===================================================== */

.menu{

    display:none;

    position:absolute;

    right:0;

    top:65px;

    width:250px;

    background:white;

    border-radius:12px;

    overflow:hidden;

    box-shadow:
        0 8px 25px rgba(0,0,0,.25);

    z-index:100;
}

.menu.aberto{

    display:block;

}

.menu button{

    width:100%;

    border:0;

    background:white;

    padding:17px;

    text-align:left;

    font-size:15px;

    cursor:pointer;

}

.menu button:hover{

    background:#f1f1f1;

}


/* =====================================================
   ÁREA PRINCIPAL
===================================================== */

.principal{

    flex:1;

    display:flex;

    flex-direction:column;

    padding:22px 28px 18px;

    min-height:0;

}


/* =====================================================
   TÍTULO
===================================================== */

.titulo{

    display:flex;

    align-items:center;

    justify-content:space-between;

    margin-bottom:15px;

}

.titulo h2{

    color:#285ca8;

    font-size:28px;

}

.titulo span{

    color:#777;

    font-size:14px;

}


/* =====================================================
   LEITOR
===================================================== */

.leitor{

    width:100%;

    background:white;

    border-radius:12px;

    padding:15px;

    box-shadow:
        0 2px 8px rgba(0,0,0,.10);

    display:flex;

    align-items:center;

    gap:12px;

    margin-bottom:15px;

    flex-shrink:0;

}

.leitor label{

    color:#285ca8;

    font-weight:bold;

    white-space:nowrap;

}

.leitor input{

    height:46px;

    flex:1;

    border:2px solid #ffda3d;

    border-radius:8px;

    outline:none;

    padding:0 15px;

    font-size:16px;

}

.leitor input:focus{

    border-color:#285ca8;

}

.botao-bipar{

    height:46px;

    padding:0 25px;

    border:0;

    border-radius:8px;

    background:#ffda3d;

    color:#285ca8;

    font-size:15px;

    font-weight:bold;

    cursor:pointer;

}


/* =====================================================
   ÁREA DA VENDA
===================================================== */

.area-venda{

    flex:1;

    min-height:0;

    display:grid;

    grid-template-columns:minmax(0,1fr) 340px;

    gap:18px;

}


/* =====================================================
   LISTA
===================================================== */

.caixa-produtos{

    background:white;

    border-radius:12px;

    overflow:hidden;

    box-shadow:
        0 2px 8px rgba(0,0,0,.10);

    display:flex;

    flex-direction:column;

    min-width:0;

}

.cabecalho-produtos{

    height:55px;

    display:grid;

    grid-template-columns:
        minmax(0,1fr)
        90px
        130px
        40px;

    align-items:center;

    padding:0 18px;

    background:#285ca8;

    color:white;

    font-weight:bold;

}

.lista{

    flex:1;

    overflow-y:auto;

}


/* =====================================================
   PRODUTO
===================================================== */

.produto{

    min-height:65px;

    display:grid;

    grid-template-columns:
        minmax(0,1fr)
        90px
        130px
        40px;

    align-items:center;

    padding:0 18px;

    border-bottom:1px solid #e6e6e6;

}

.produto-nome{

    font-weight:bold;

    color:#333;

}

.produto-codigo{

    display:block;

    color:#999;

    font-size:11px;

    margin-top:3px;

}

.produto-qtd{

    text-align:center;

    font-weight:bold;

}

.produto-preco{

    text-align:right;

    font-weight:bold;

    color:#285ca8;

}

.excluir{

    width:30px;

    height:30px;

    border:0;

    border-radius:6px;

    background:#eee;

    cursor:pointer;

}


/* =====================================================
   MENSAGEM VAZIA
===================================================== */

.vazio{

    height:100%;

    min-height:250px;

    display:flex;

    align-items:center;

    justify-content:center;

    flex-direction:column;

    color:#999;

    text-align:center;

}

.vazio-icone{

    font-size:48px;

    margin-bottom:10px;

}

.vazio strong{

    color:#666;

    font-size:17px;

}


/* =====================================================
   RESUMO
===================================================== */

.resumo{

    background:white;

    border-radius:12px;

    overflow:hidden;

    box-shadow:
        0 2px 8px rgba(0,0,0,.10);

    display:flex;

    flex-direction:column;

}


/* TOTAL */

.total{

    background:#285ca8;

    color:white;

    padding:22px;

}

.total small{

    display:block;

    font-size:14px;

    margin-bottom:7px;

}

.total strong{

    display:block;

    font-size:39px;

}


/* PAGAMENTO */

.pagamento{

    padding:17px;

}

.pagamento h3{

    color:#285ca8;

    font-size:18px;

    margin-bottom:12px;

}

.pagamentos{

    display:grid;

    grid-template-columns:1fr 1fr;

    gap:8px;

}

.pagamentos button{

    height:45px;

    border:2px solid #ddd;

    background:white;

    border-radius:8px;

    color:#285ca8;

    font-weight:bold;

    cursor:pointer;

}

.pagamentos button.selecionado{

    background:#ffda3d;

    border-color:#ffda3d;

}


/* FINALIZAR */

.finalizar{

    margin:auto 17px 17px;

    height:52px;

    border:0;

    border-radius:9px;

    background:#285ca8;

    color:white;

    font-size:16px;

    font-weight:bold;

    cursor:pointer;

}

.finalizar:hover{

    background:#1f4d91;

}


/* =====================================================
   RODAPÉ
===================================================== */

.rodape{

    height:42px;

    background:#111;

    color:white;

    display:flex;

    align-items:center;

    justify-content:space-between;

    padding:0 25px;

    font-size:12px;

    flex-shrink:0;

}

.rodape strong{

    color:#ffda3d;

}


/* =====================================================
   MODAL VENDAS DO DIA
===================================================== */

.modal{

    display:none;

    position:fixed;

    inset:0;

    background:rgba(0,0,0,.65);

    z-index:500;

    align-items:center;

    justify-content:center;

    padding:30px;

}

.modal.aberto{

    display:flex;

}

.janela{

    width:min(750px,100%);

    max-height:85vh;

    background:white;

    border-radius:14px;

    overflow:hidden;

}

.janela-topo{

    height:60px;

    background:#285ca8;

    color:white;

    padding:0 20px;

    display:flex;

    align-items:center;

    justify-content:space-between;

}

.janela-topo button{

    border:0;

    background:transparent;

    color:white;

    font-size:28px;

    cursor:pointer;

}

.vendas-lista{

    padding:20px;

    max-height:70vh;

    overflow-y:auto;

}

.venda{

    border:1px solid #ddd;

    border-radius:9px;

    padding:14px;

    margin-bottom:10px;

}

.venda strong{

    color:#285ca8;

}


/* =====================================================
   RESPONSIVO
   MANTÉM O FORMATO DO DAV
===================================================== */

@media(max-width:700px){

    #dav{

        min-width:900px;

    }

    .cabecalho{

        height:100px;

        padding:0 25px;

    }

    .logo{

        width:76px;
        height:76px;

        font-size:32px;

    }

    .nome-supermercado h1{

        font-size:23px;

    }

    .principal{

        padding:18px 22px;

    }

}


/* =====================================================
   ESCONDER BARRA LATERAL / NUNCA USAR
===================================================== */

.sidebar{

    display:none !important;

}

</style>
</head>


<body>


<div id="dav">


    <!-- =================================================
         CABEÇALHO
    ================================================== -->

    <header class="cabecalho">

        <div class="logo">
            VB
        </div>


        <div class="nome-supermercado">

            <h1>
                Supermercado Val Bença
            </h1>

            <span>
                DAV • Frente de Caixa
            </span>

        </div>


        <div class="menu-area">

            <button
                class="botao-menu"
                onclick="abrirMenu()">

                ⋮

            </button>


            <div
                class="menu"
                id="menu">

                <button onclick="abrirVendasDoDia()">
                    📋 Vendas do dia
                </button>

                <button onclick="aviso('Consulta de produtos')">
                    🔎 Consulta de produtos
                </button>

                <button onclick="aviso('Financeiro')">
                    💰 Financeiro
                </button>

                <button onclick="aviso('Relatórios')">
                    📊 Relatórios
                </button>

                <button onclick="aviso('Configurações')">
                    ⚙️ Configurações
                </button>

            </div>

        </div>

    </header>



    <!-- =================================================
         PRINCIPAL
    ================================================== -->

    <main class="principal">


        <div class="titulo">

            <div>

                <h2>
                    Nova venda
                </h2>

            </div>

            <span>
                Passe os produtos no leitor
            </span>

        </div>



        <!-- LEITOR -->

        <div class="leitor">

            <label>
                Código de barras
            </label>

            <input
                id="codigo"
                type="text"
                placeholder="Passe o produto no leitor..."
                autocomplete="off">

            <button
                class="botao-bipar"
                onclick="bipar()">

                BIPAR PRODUTO

            </button>

        </div>



        <!-- =================================================
             VENDA
        ================================================== -->

        <div class="area-venda">


            <!-- PRODUTOS -->

            <section class="caixa-produtos">

                <div class="cabecalho-produtos">

                    <span>
                        Produto
                    </span>

                    <span>
                        Qtd.
                    </span>

                    <span>
                        Total
                    </span>

                    <span>
                    </span>

                </div>


                <div
                    class="lista"
                    id="listaProdutos">

                    <div class="vazio">

                        <div class="vazio-icone">
                            🛒
                        </div>

                        <strong>
                            Nenhum produto na venda
                        </strong>

                        <span>
                            Passe os produtos no leitor
                        </span>

                    </div>

                </div>

            </section>



            <!-- =================================================
                 RESUMO
            ================================================== -->

            <section class="resumo">


                <div class="total">

                    <small>
                        TOTAL DA VENDA
                    </small>

                    <strong id="total">
                        R$ 0,00
                    </strong>

                </div>


                <div class="pagamento">

                    <h3>
                        Forma de pagamento
                    </h3>


                    <div class="pagamentos">

                        <button
                            onclick="selecionarPagamento(this,'Dinheiro')">
                            💵 Dinheiro
                        </button>

                        <button
                            onclick="selecionarPagamento(this,'Pix')">
                            📱 Pix
                        </button>

                        <button
                            onclick="selecionarPagamento(this,'Débito')">
                            💳 Débito
                        </button>

                        <button
                            onclick="selecionarPagamento(this,'Crédito')">
                            💳 Crédito
                        </button>

                    </div>

                </div>


                <button
                    class="finalizar"
                    onclick="finalizarVenda()">

                    FINALIZAR VENDA

                </button>


            </section>

        </div>

    </main>



    <!-- =================================================
         RODAPÉ
    ================================================== -->

    <footer class="rodape">

        <span>
            Supermercado Val Bença
        </span>

        <strong>
            GT Delivery
        </strong>

    </footer>

</div>



<!-- =====================================================
     MODAL VENDAS DO DIA
===================================================== -->

<div
    class="modal"
    id="modalVendas">

    <div class="janela">

        <div class="janela-topo">

            <strong>
                Vendas do dia
            </strong>

            <button onclick="fecharVendas()">
                ×
            </button>

        </div>


        <div
            class="vendas-lista"
            id="vendasLista">

        </div>

    </div>

</div>



<script>

/* =====================================================
   PRODUTOS
===================================================== */

const produtosBanco = {

    "7891000100103":{
        nome:"Arroz Branco 5kg",
        preco:27.90
    },

    "7891000100202":{
        nome:"Feijão Carioca 1kg",
        preco:8.49
    },

    "7891000100301":{
        nome:"Açúcar Cristal 1kg",
        preco:4.99
    },

    "7891000100400":{
        nome:"Café 500g",
        preco:16.90
    },

    "7891000100509":{
        nome:"Leite Integral 1L",
        preco:5.49
    }

};


let carrinho = [];

let pagamentoAtual = "";

let vendasDoDia = [];


/* =====================================================
   MENU
===================================================== */

function abrirMenu(){

    document
        .getElementById("menu")
        .classList.toggle("aberto");

}


/* =====================================================
   BIPAR PRODUTO
===================================================== */

function bipar(){

    const campo =
        document.getElementById("codigo");

    const codigo =
        campo.value.trim();

    if(!codigo){

        campo.focus();

        return;

    }


    let produto =
        produtosBanco[codigo];


    if(!produto){

        produto = {

            nome:"Produto " + codigo,

            preco:10.00

        };

    }


    const existente =
        carrinho.find(
            item => item.codigo === codigo
        );


    if(existente){

        existente.quantidade++;

    }else{

        carrinho.push({

            codigo:codigo,

            nome:produto.nome,

            preco:produto.preco,

            quantidade:1

        });

    }


    campo.value = "";

    atualizarTela();

    campo.focus();

}


/* =====================================================
   ENTER DO LEITOR
===================================================== */

document
    .getElementById("codigo")
    .addEventListener(
        "keydown",
        function(event){

            if(event.key === "Enter"){

                bipar();

            }

        }
    );


/* =====================================================
   ATUALIZAR TELA
===================================================== */

function atualizarTela(){

    const lista =
        document.getElementById("listaProdutos");

    lista.innerHTML = "";


    if(carrinho.length === 0){

        lista.innerHTML = `

            <div class="vazio">

                <div class="vazio-icone">
                    🛒
                </div>

                <strong>
                    Nenhum produto na venda
                </strong>

                <span>
                    Passe os produtos no leitor
                </span>

            </div>

        `;

        atualizarTotal();

        return;

    }


    carrinho.forEach(
        (produto,index)=>{

            const subtotal =
                produto.preco *
                produto.quantidade;


            lista.innerHTML += `

                <div class="produto">

                    <div>

                        <div class="produto-nome">
                            ${produto.nome}
                        </div>

                        <span class="produto-codigo">
                            ${produto.codigo}
                        </span>

                    </div>


                    <div class="produto-qtd">
                        ${produto.quantidade}
                    </div>


                    <div class="produto-preco">

                        ${formatarMoeda(subtotal)}

                    </div>


                    <button
                        class="excluir"
                        onclick="removerProduto(${index})">

                        ×

                    </button>

                </div>

            `;

        }
    );


    atualizarTotal();

}


/* =====================================================
   TOTAL
===================================================== */

function atualizarTotal(){

    let total = 0;


    carrinho.forEach(
        produto => {

            total +=
                produto.preco *
                produto.quantidade;

        }
    );


    document
        .getElementById("total")
        .innerText =
            formatarMoeda(total);

}


/* =====================================================
   REMOVER
===================================================== */

function removerProduto(index){

    if(
        carrinho[index].quantidade > 1
    ){

        carrinho[index].quantidade--;

    }else{

        carrinho.splice(index,1);

    }


    atualizarTela();

}


/* =====================================================
   PAGAMENTO
===================================================== */

function selecionarPagamento(
    botao,
    forma
){

    document
        .querySelectorAll(
            ".pagamentos button"
        )
        .forEach(
            b =>
                b.classList.remove(
                    "selecionado"
                )
        );


    botao.classList.add(
        "selecionado"
    );


    pagamentoAtual = forma;

}


/* =====================================================
   FINALIZAR VENDA
===================================================== */

function finalizarVenda(){

    if(carrinho.length === 0){

        alert(
            "Nenhum produto foi adicionado."
        );

        return;

    }


    if(!pagamentoAtual){

        alert(
            "Escolha a forma de pagamento."
        );

        return;

    }


    let total = 0;


    carrinho.forEach(
        produto => {

            total +=
                produto.preco *
                produto.quantidade;

        }
    );


    vendasDoDia.push({

        numero:
            vendasDoDia.length + 1,

        horario:
            new Date(),

        produtos:
            JSON.parse(
                JSON.stringify(carrinho)
            ),

        pagamento:
            pagamentoAtual,

        total:
            total

    });


    alert(
        "Venda finalizada com sucesso!"
    );


    carrinho = [];

    pagamentoAtual = "";


    document
        .querySelectorAll(
            ".pagamentos button"
        )
        .forEach(
            b =>
                b.classList.remove(
                    "selecionado"
                )
        );


    atualizarTela();

}


/* =====================================================
   VENDAS DO DIA
   SOMENTE NO MENU ⋮
===================================================== */

function abrirVendasDoDia(){

    document
        .getElementById("menu")
        .classList.remove("aberto");


    const lista =
        document.getElementById(
            "vendasLista"
        );


    lista.innerHTML = "";


    if(vendasDoDia.length === 0){

        lista.innerHTML = `

            <div style="
                text-align:center;
                padding:50px;
                color:#888;
            ">

                Nenhuma venda realizada hoje.

            </div>

        `;

    }else{

        [...vendasDoDia]
            .reverse()
            .forEach(
                venda => {

                    const hora =
                        venda.horario
                        .toLocaleTimeString(
                            "pt-BR",
                            {
                                hour:"2-digit",
                                minute:"2-digit"
                            }
                        );


                    let produtos = "";


                    venda.produtos.forEach(
                        produto => {

                            produtos += `
                                ${produto.quantidade}x
                                ${produto.nome}
                                <br>
                            `;

                        }
                    );


                    lista.innerHTML += `

                        <div class="venda">

                            <strong>
                                Venda #${venda.numero}
                            </strong>

                            <span>
                                — ${hora}
                            </span>

                            <div style="
                                margin-top:10px;
                                line-height:1.6;
                            ">

                                ${produtos}

                            </div>


                            <div style="
                                margin-top:8px;
                            ">

                                Pagamento:
                                <strong>
                                    ${venda.pagamento}
                                </strong>

                            </div>


                            <div style="
                                margin-top:8px;
                                font-size:19px;
                                font-weight:bold;
                            ">

                                ${formatarMoeda(
                                    venda.total
                                )}

                            </div>

                        </div>

                    `;

                }
            );

    }


    document
        .getElementById(
            "modalVendas"
        )
        .classList.add("aberto");

}


/* =====================================================
   FECHAR VENDAS
===================================================== */

function fecharVendas(){

    document
        .getElementById(
            "modalVendas"
        )
        .classList.remove("aberto");

}


/* =====================================================
   ALERTAS
===================================================== */

function aviso(texto){

    document
        .getElementById("menu")
        .classList.remove("aberto");

    alert(texto);

}


/* =====================================================
   MOEDA
===================================================== */

function formatarMoeda(valor){

    return valor.toLocaleString(
        "pt-BR",
        {
            style:"currency",
            currency:"BRL"
        }
    );

}


/* =====================================================
   FECHAR MENU CLICANDO FORA
===================================================== */

document.addEventListener(
    "click",
    function(event){

        const menuArea =
            document.querySelector(
                ".menu-area"
            );

        if(
            !menuArea.contains(
                event.target
            )
        ){

            document
                .getElementById("menu")
                .classList.remove(
                    "aberto"
                );

        }

    }
);


/* =====================================================
   FOCO NO LEITOR
===================================================== */

window.onload = function(){

    document
        .getElementById("codigo")
        .focus();

};

</script>

</body>
</html>
